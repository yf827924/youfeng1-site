<title>镖局经营·走镖录</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  /* 安卓安全区 */
  :root { --sa: env(safe-area-inset-top, 0px); --sb: env(safe-area-inset-bottom, 0px); }
  html, body { padding-top: var(--sa, 0px); padding-bottom: var(--sb, 0px); }
  html,body { height:100%; width:100%; min-height:100vh; background:#15110c; color:#f3e9d2; font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif; overflow:hidden; }
  /* 高度优先级：JS 实测可见高度 --app-h > 动态视口 100dvh > 老式 100vh。
     鸿蒙/安卓 WebView 的地址栏与手势条会吃掉一段高度，100vh 算出来的偏大，底部内容被挤出屏幕。 */
  #wrap { position:relative; width:100vw; height:100vh; height:100dvh; height:var(--app-h, 100dvh); }
  canvas { background:#231a10; touch-action:none; width:100%; height:100%; display:block; }
  .hud { position:absolute; top:max(10px, var(--sa)); left:10px; right:10px; display:flex; justify-content:space-between; gap:8px; font-size:14px; pointer-events:none; z-index:5; }
  .pill { background:rgba(20,15,8,.78); border:1px solid #6b4f2a; border-radius:999px; padding:4px 8px; white-space:nowrap; font-size:12px; }
  .pill b { color:#ffd479; }
  @media (max-width:480px) {
    .pill { font-size:11px; padding:3px 6px; max-width:110px; overflow:hidden; text-overflow:ellipsis; }
    .hud { font-size:11px; }
    .quickRow button { font-size:12px; padding:9px 3px; }
    .tabbar button { font-size:12px; padding:8px 2px; }
    .tabPanel button { font-size:12px; padding:9px 4px; }
  }
  .panel { position:absolute; left:10px; right:10px; bottom:max(24px, calc(var(--sb) + 14px)); display:flex; gap:8px; z-index:7; flex-wrap:wrap; }
  .panel button { flex:1; min-width:90px; font-size:14px; padding:10px 8px; border:0; border-radius:10px; background:linear-gradient(135deg,#7a5a2e,#a9803d); color:#fff; cursor:pointer; }
  .panel button:disabled { opacity:.4; cursor:not-allowed; }

  /* 手机版：顶部常驻快捷操作（招募 / 过天 / 换镖单） */
  .quickRow { position:absolute; left:50%; transform:translateX(-50%); top:calc(var(--sa) + 40px); width:min(92%,460px); display:flex; gap:8px; z-index:6; }
  .quickRow button { flex:1; font-size:14px; padding:11px 6px; border:0; border-radius:12px; background:linear-gradient(135deg,#8a6a32,#caa24a); color:#1a1208; font-weight:bold; cursor:pointer; box-shadow:0 4px 12px rgba(0,0,0,.45); }
  .quickRow button:disabled { opacity:.4; cursor:not-allowed; }
  .campaign-on .quickRow { top:calc(var(--sa) + var(--cb-bottom, 108px) + 8px); }
  /* 底部 Tab 栏 */
  .tabbar { position:absolute; left:10px; right:10px; bottom:calc(var(--sb) + 8px); height:42px; display:flex; gap:6px; z-index:7; }
  .tabbar button { flex:1; height:100%; font-size:13px; border:0; border-radius:10px 10px 0 0; background:rgba(28,21,12,.95); border:1px solid #6b4f2a; border-bottom:0; color:#d8c8a8; cursor:pointer; }
  .tabbar button.active { background:linear-gradient(135deg,#7a5a2e,#a9803d); color:#fff; border-color:#ffd479; }
  /* 分组面板（点 Tab 弹出） */
  .tabPanels { position:absolute; left:10px; right:10px; bottom:calc(var(--sb) + 56px); z-index:7; }
  .tabPanel { display:none; flex-wrap:wrap; gap:8px; background:rgba(20,15,8,.97); border:1px solid #6b4f2a; border-radius:12px 12px 0 0; padding:10px; max-height:42vh; overflow-y:auto; box-shadow:0 -8px 24px rgba(0,0,0,.5); }
  .tabPanel.show { display:flex; }
  .tabPanel button { flex:1; min-width:84px; font-size:13px; padding:10px 8px; border:0; border-radius:10px; background:linear-gradient(135deg,#7a5a2e,#a9803d); color:#fff; cursor:pointer; }
  .tabPanel button:disabled { opacity:.4; cursor:not-allowed; }
  .center { position:absolute; left:50%; top:calc(var(--sa) + 84px); bottom:calc(var(--panel-h, 64px) + var(--sb)); transform:translateX(-50%); width:min(92%,460px); z-index:6; display:flex; flex-direction:column; gap:10px; overflow:auto; }
  .card { background:rgba(28,21,12,.92); border:1px solid #6b4f2a; border-radius:12px; padding:12px 14px; cursor:pointer; transition:.15s; }
  .card.adv { background:linear-gradient(135deg,rgba(60,40,8,.95),rgba(40,28,12,.95)); border-color:#c9a24a; box-shadow:0 0 0 1px rgba(201,162,74,.4),0 0 14px rgba(201,162,74,.18); }
  .badge-adv { display:inline-block; margin-left:6px; font-size:11px; color:#1a1208; background:#e8c25a; border-radius:6px; padding:1px 6px; vertical-align:middle; }
  .card:hover { border-color:#ffd479; transform:translateY(-1px); }
  .card.locked { opacity:.5; cursor:not-allowed; }
  .card h3 { font-size:15px; color:#ffd479; margin-bottom:6px; }
  .card .row { display:flex; justify-content:space-between; font-size:13px; color:#d8c8a8; margin:2px 0; }
  .tag { font-size:11px; padding:1px 7px; border-radius:6px; background:#3a2c18; color:#ffd479; }
  .overlay { position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:16px; background:rgba(10,8,4,.85); text-align:center; padding:24px; z-index:10; backdrop-filter:blur(4px); }
  .hidden { display:none !important; }
  .overlay h1 { font-size:30px; color:#ffd479; letter-spacing:4px; }
  .overlay p { font-size:15px; color:#d8c8a8; line-height:1.7; max-width:360px; }
  .overlay button { font-size:18px; padding:12px 32px; border:0; border-radius:999px; background:linear-gradient(135deg,#7a5a2e,#a9803d); color:#fff; cursor:pointer; }
  .toast { position:absolute; left:50%; top:18%; transform:translateX(-50%); background:rgba(20,15,8,.95); border:1px solid #ffd479; border-radius:10px; padding:10px 18px; font-size:14px; z-index:8; opacity:0; transition:.25s; pointer-events:none; color:#ffd479; }
  .toast.show { opacity:1; }
  .escortCanvas { position:absolute; inset:0; z-index:9; display:flex; align-items:center; justify-content:center; }
  .hint { position:absolute; left:50%; top:9%; transform:translateX(-50%); font-size:13px; color:#c9b48c; z-index:6; }
  /* 通关模式任务条：常驻显示本关通关条件与实时进度 */
  .campaignBar { position:absolute; top:max(44px, calc(var(--sa) + 34px)); left:50%; transform:translateX(-50%); width:min(92%,460px); z-index:6; background:rgba(20,15,8,.88); border:1px solid #8a6a32; border-radius:10px; padding:6px 12px 8px; font-size:12px; color:#c9b48c; pointer-events:none; box-shadow:0 6px 18px rgba(0,0,0,.5); }
  .campaignBar .cb-t { color:#ffd479; font-weight:bold; font-size:13px; letter-spacing:1px; margin-bottom:4px; display:flex; justify-content:space-between; }
  .campaignBar .cb-r { display:flex; gap:12px; flex-wrap:wrap; line-height:1.7; }
  .campaignBar .cb-ok { color:#7ee08a; }
  .campaignBar .cb-ng { color:#ff9a6b; }
  .campaignBar .cb-bar { height:4px; background:#3a2c18; border-radius:2px; margin-top:5px; overflow:hidden; }
  .campaignBar .cb-bar i { display:block; height:100%; background:linear-gradient(90deg,#a9803d,#ffd479); border-radius:2px; transition:width .4s; }
  .campaign-on .center { top:calc(var(--sa) + var(--cb-bottom, 108px) + 56px); }
  @media (max-width:480px) {
    .campaignBar { top:max(40px, calc(var(--sa) + 32px)); padding:5px 10px 7px; font-size:11px; }
    .campaignBar .cb-t { font-size:12px; }
    .campaignBar .cb-r { gap:8px; }
    .campaign-on .center { top:calc(var(--sa) + var(--cb-bottom, 108px) + 56px); }
    /* 战斗 6 操作按钮在小屏自适应：缩小字号与最小宽，保留可点 */
    .combatLog { height:46px; font-size:11px; padding:6px 8px; }
    .combatActions button { min-width:62px; font-size:12px; padding:9px 4px; }
    /* 库房/花名册列表项紧凑化 */
    .storeItem, .rosterItem { padding:8px 10px; margin:6px 0; font-size:12px; }
    .storeItem button { padding:6px 10px; font-size:12px; }
    /* 模态内边距收窄，内容多显示一行 */
    .modal .box { padding:14px; }
    /* 结算卡头像缩小 */
    .endcard { padding:16px; }
    .endcard .ec-photo { width:58px; height:58px; }
    .endcard .ec-body { gap:10px; }
    .endcard .ec-seal { width:42px; height:42px; right:12px; bottom:50px; font-size:13px; }
    .endcard .ec-wax { width:36px; height:36px; right:10px; bottom:10px; font-size:17px; }
    /* toast/hint 在小屏避让任务条 */
    .toast { top:22%; font-size:13px; padding:8px 14px; max-width:90%; }
    .hint { top:6%; font-size:12px; max-width:90%; }
    /* 委托书 tip 宽度收窄 */
    .ctip { width:min(280px, calc(100vw - 32px)); }
    /* 全屏覆盖层（登录/开始/结算）标题与按钮缩小 */
    .overlay { padding:18px; gap:12px; }
    .overlay h1 { font-size:24px; letter-spacing:2px; }
    .overlay p { font-size:14px; line-height:1.6; max-width:92%; }
    .overlay button { font-size:15px; padding:10px 24px; }
    .authScreen h1 { font-size:26px; }
  }
  .fxFire { position:fixed; inset:0; width:100%; height:100%; z-index:98; pointer-events:none; display:none; }
  .modal { position:absolute; inset:0; background:rgba(10,8,4,.7); display:flex; align-items:center; justify-content:center; z-index:11; }
  .modal .box { background:rgba(28,21,12,.95); border:1px solid #6b4f2a; border-radius:14px; padding:18px; width:min(90%,420px); max-height:85vh; display:flex; flex-direction:column; overflow:hidden; backdrop-filter:blur(8px); }
  .modal .box-body { flex:1; overflow-y:auto; min-height:0; }
  /* flex-basis 必须为 auto：写成 flex:1（basis:0）会让每个子元素被压到 0 基准高度。
     弹窗里若有几十个并列 div（图鉴/年表的条目行），会被 flex 均分空间后塌缩成极小高度，
     文字互相重叠，看起来像「乱字符」。basis:auto 保证高度不低于内容本身。 */
  .modal .box > :not(h3):not(.close):not(.box-footer):not(.box-body) { flex:1 1 auto; overflow-y:auto; min-height:0; }
  .modal .box-footer { padding-top:12px; display:flex; gap:8px; flex-shrink:0; }
  .modal .box h3 { color:#ffd479; margin-bottom:12px; font-size:17px; }
  .modal .opt { display:flex; justify-content:space-between; align-items:center; padding:10px 12px; border:1px solid #4a3a22; border-radius:10px; margin:8px 0; cursor:pointer; }
  .modal .opt:hover { border-color:#ffd479; }
  .modal .opt small { color:#c9b48c; }
  .modal .close { margin-top:0; width:100%; padding:10px; border:0; border-radius:10px; background:#3a2c18; color:#f3e9d2; cursor:pointer; flex-shrink:0; }
  /* 库房 / 战斗 */
  .tabs { display:flex; gap:6px; margin-bottom:10px; }
  /* 库房：tabs 固定吸顶，内容区独立滚动（否则滚动后 武器库/药材库/镖师 被内容顶出屏幕） */
  #storeModal .tabs { flex:0 0 auto; position:sticky; top:0; z-index:3; background:rgba(28,21,12,.98); padding:6px 0 4px; box-shadow:0 4px 10px -2px rgba(0,0,0,.55); }
  #storeModal #storeBody { flex:1; overflow-y:auto; min-height:0; -webkit-overflow-scrolling:touch; scroll-padding-top:6px; padding-top:2px; }
  #storeBody .subtabs { position:sticky; top:0; z-index:2; background:rgba(28,21,12,.98); padding:4px 0 6px; box-shadow:0 3px 8px -2px rgba(0,0,0,.5); }
  .tabs button { flex:1; padding:8px; border:0; border-radius:8px; background:#3a2c18; color:#f3e9d2; cursor:pointer; font-size:14px; }
  .tabs button.active { background:linear-gradient(135deg,#7a5a2e,#a9803d); color:#fff; }
  .subtabs { display:flex; gap:6px; margin-bottom:10px; }
  .subtabs button { flex:1; padding:7px; border:0; border-radius:8px; background:#3a2c18; color:#f3e9d2; cursor:pointer; font-size:13px; }
  .subtabs button.active { background:linear-gradient(135deg,#7a5a2e,#a9803d); color:#fff; }
  .danger { background:linear-gradient(135deg,#8a3a2e,#b0473a) !important; }

  .storeItem { display:flex; justify-content:space-between; align-items:center; padding:10px 12px; border:1px solid #4a3a22; border-radius:10px; margin:8px 0; }
  .storeItem .info { font-size:13px; color:#d8c8a8; }
  .storeItem .info small { color:#c9b48c; display:block; margin-top:3px; }
  .storeItem button { padding:7px 12px; border:0; border-radius:8px; background:linear-gradient(135deg,#7a5a2e,#a9803d); color:#fff; cursor:pointer; font-size:13px; white-space:nowrap; }
  .storeItem button:disabled { opacity:.4; cursor:not-allowed; }
  .rosterItem { padding:10px 12px; border:1px solid #4a3a22; border-radius:10px; margin:8px 0; cursor:pointer; font-size:13px; color:#d8c8a8; }
  .rosterItem:hover { border-color:#ffd479; }
  .rosterItem small { color:#c9b48c; }
  .combatUI { position:absolute; left:0; right:0; bottom:max(0px, var(--sb)); padding:10px; padding-bottom:max(10px, calc(var(--sb) + 10px)); z-index:12; display:flex; flex-direction:column; gap:8px; }
  .combatLog { background:rgba(0,0,0,.55); border:1px solid #6b4f2a; border-radius:8px; padding:8px 10px; font-size:12px; color:#ffe6b0; height:58px; overflow:hidden; line-height:1.5; }
  .combatActions { display:flex; gap:6px; flex-wrap:wrap; }
  .combatActions button { flex:1; min-width:84px; font-size:14px; padding:11px 6px; border:0; border-radius:10px; background:linear-gradient(135deg,#7a5a2e,#a9803d); color:#fff; cursor:pointer; }
  .combatActions button:disabled { opacity:.4; cursor:not-allowed; }
  .combatActions button.flee { background:linear-gradient(135deg,#5a3a2a,#7a4a3a); }
  .authScreen input { width:100%; font-size:16px; padding:12px; border-radius:10px; border:1px solid #6b4f2a; background:#1c150c; color:#f3e9d2; box-sizing:border-box; }
  .authScreen .row2 { display:flex; gap:10px; }
  .authScreen .row2 button { flex:1; }
  #authErr { color:#e0533b; font-size:13px; min-height:16px; }
  /* 运镖委托书悬停弹窗 */
  .ctip{position:fixed;z-index:60;width:280px;background:linear-gradient(160deg,#2a1f12,#3a2c18);border:2px solid #8a6a32;border-radius:12px;padding:14px;color:#f3e9d2;box-shadow:0 12px 36px rgba(0,0,0,.6);display:none;font-size:13px;pointer-events:none;}
  .ctip .ct-title{font-size:16px;font-weight:bold;color:#ffd479;border-bottom:1px dashed #8a6a32;padding-bottom:6px;margin-bottom:8px;letter-spacing:2px;}

  .ctip .ct-photo{width:54px;height:54px;border-radius:8px;object-fit:cover;border:2px solid #6b4f2a;}
  .ctip .ct-name{font-weight:bold;color:#fff;}
  .ctip .ct-sub{font-size:12px;color:#c9b48c;margin-top:2px;}
  .ctip .ct-rows{margin:6px 0;}
  .ctip .ct-rows div{display:flex;justify-content:space-between;padding:3px 0;border-bottom:1px dotted rgba(255,255,255,.1);}
  .ctip .ct-rows b{color:#ffd479;}
  .ctip .ct-note{margin-top:8px;font-size:12px;color:#ffcf9a;background:rgba(255,180,90,.14);padding:6px 8px;border-radius:8px;line-height:1.5;}
  .storeItem button.danger{ background:linear-gradient(135deg,#7a3a2e,#a94a3d); }

  /* 委托书印章 / 火漆 */
  .ctip .ct-seal{position:absolute;right:14px;bottom:54px;width:46px;height:46px;border:3px solid #c0392b;border-radius:8px;color:#c0392b;font-family:"KaiTi","STKaiti",serif;font-weight:bold;font-size:15px;display:flex;align-items:center;justify-content:center;line-height:1.05;text-align:center;transform:rotate(-12deg);opacity:.82;box-shadow:0 0 0 2px rgba(192,57,43,.25) inset;}
  .ctip .ct-wax{position:absolute;right:10px;bottom:10px;width:40px;height:40px;border-radius:50%;background:radial-gradient(circle at 35% 30%, #e85b4a, #9b2417 70%);box-shadow:0 3px 8px rgba(0,0,0,.5), inset 0 -4px 8px rgba(0,0,0,.4), inset 0 3px 6px rgba(255,255,255,.25);color:#ffe6df;font-family:"KaiTi","STKaiti",serif;font-weight:bold;font-size:18px;display:flex;align-items:center;justify-content:center;transform:rotate(8deg);text-shadow:0 1px 1px rgba(0,0,0,.4);}
  /* 战斗结算卡 */
  .endcard{position:relative;width:min(86%,380px);background:linear-gradient(160deg,#2a1f12,#3a2c18);border:2px solid #8a6a32;border-radius:16px;padding:20px;color:#f3e9d2;box-shadow:0 16px 48px rgba(0,0,0,.7);overflow:hidden;}
  .endcard.win{border-color:#d4af37;}
  .endcard.lose{border-color:#a23b2f;}
  .endcard .ec-result{font-size:22px;font-weight:bold;text-align:center;letter-spacing:3px;margin-bottom:14px;}
  .endcard.win .ec-result{color:#ffd479;}
  .endcard.lose .ec-result{color:#ff8a7a;}
  .endcard.retreat .ec-result{color:#9fd0ff;}
  .endcard .ec-body{display:flex;gap:14px;align-items:flex-start;}
  .endcard .ec-photo{width:72px;height:72px;border-radius:10px;object-fit:cover;border:2px solid #6b4f2a;flex:0 0 auto;}
  .endcard .ec-info{flex:1;}
  .endcard .ec-client{font-weight:bold;color:#fff;font-size:15px;}
  .endcard .ec-title{font-size:12px;color:#c9b48c;margin:2px 0 10px;}
  .endcard .ec-rewards{margin-top:4px;}
  .endcard .ec-row{display:flex;justify-content:space-between;padding:4px 0;border-bottom:1px dotted rgba(255,255,255,.12);}
  .endcard .ec-row b{color:#ffd479;}
  .endcard .ec-row b.pos{color:#9be29b;}
  .endcard .ec-row b.neg{color:#ff8a7a;}
  .endcard .ec-seal{position:absolute;right:16px;bottom:58px;width:52px;height:52px;border:3px solid #c0392b;border-radius:8px;color:#c0392b;font-family:"KaiTi","STKaiti",serif;font-weight:bold;font-size:16px;display:flex;align-items:center;justify-content:center;text-align:center;line-height:1.05;transform:rotate(-12deg);opacity:.85;}
  .endcard .ec-wax{position:absolute;right:12px;bottom:12px;width:44px;height:44px;border-radius:50%;background:radial-gradient(circle at 35% 30%, #e85b4a, #9b2417 70%);box-shadow:0 3px 8px rgba(0,0,0,.5), inset 0 -4px 8px rgba(0,0,0,.4), inset 0 3px 6px rgba(255,255,255,.25);color:#ffe6df;font-family:"KaiTi","STKaiti",serif;font-weight:bold;font-size:20px;display:flex;align-items:center;justify-content:center;transform:rotate(8deg);text-shadow:0 1px 1px rgba(0,0,0,.4);}
  .endcard .ec-btn{margin-top:16px;width:100%;padding:11px;border:0;border-radius:10px;background:linear-gradient(160deg,#caa24a,#8a6a32);color:#1a1208;font-weight:bold;font-size:15px;cursor:pointer;}

<script>
const cv = document.getElementById('game'), ctx = cv.getContext('2d');
let W = window.innerWidth, H = window.innerHeight;

// ===== 视口高度同步 =====
// 手机浏览器的地址栏、手势条会占用屏幕，window.innerHeight 算出来的高度比真实可见区大，
// 用它布局会把底部按钮顶出屏幕。这里优先取 visualViewport.height（真正的可见高度），
// 写进 CSS 变量 --app-h 驱动 #wrap 高度；不支持的 WebView 自动回落到 100dvh / 100vh。
function _appVisibleH(){
  const wEl = document.getElementById('wrap');
  if(wEl && wEl.clientHeight > 0) return wEl.clientHeight;
  if(window.visualViewport && window.visualViewport.height > 0) return window.visualViewport.height;
  return window.innerHeight;
}
function syncViewportHeight(){
  let h = 0;
  if(window.visualViewport && window.visualViewport.height > 0) h = window.visualViewport.height;
  if(!h || h > window.innerHeight) h = window.innerHeight;
  if(h > 0) document.documentElement.style.setProperty('--app-h', Math.round(h) + 'px');
  measurePanel();
}
// 测量底部按钮组（.panel 自适应换行，高度随屏宽/按钮显隐变化），写入 --panel-h，
// 驱动 .center 的 bottom，避免最后一张镖单被按钮遮住
function measurePanel(){
  try{
    const tab = document.getElementById('tabbar');
    const panel = document.querySelector('.tabPanel.show');
    let h = 0;
    if(tab && typeof tab.offsetHeight === 'number' && tab.offsetHeight > 0) h += tab.offsetHeight;
    if(panel && typeof panel.offsetHeight === 'number' && panel.offsetHeight > 0) h += panel.offsetHeight;
    h += 14; // tab 栏与弹出面板之上的留白
    if(h > 0) document.documentElement.style.setProperty('--panel-h', Math.ceil(h) + 'px');
  }catch(e){}
}
syncViewportHeight();
window.addEventListener('resize', syncViewportHeight);
window.addEventListener('orientationchange', ()=> setTimeout(syncViewportHeight, 300));
if(window.visualViewport) window.visualViewport.addEventListener('resize', syncViewportHeight);
setTimeout(syncViewportHeight, 300);
setTimeout(syncViewportHeight, 1000);

// ===== 底部 Tab 栏切换 =====
function showTab(name){
  document.querySelectorAll('.tabbar button').forEach(b=> b.classList.toggle('active', b.dataset.tab === name));
  document.querySelectorAll('.tabPanel').forEach(p=> p.classList.toggle('show', p.dataset.panel === name));
  measurePanel();
}
function closeTab(){
  document.querySelectorAll('.tabbar button').forEach(b=> b.classList.remove('active'));
  document.querySelectorAll('.tabPanel').forEach(p=> p.classList.remove('show'));
  measurePanel();
}
document.querySelectorAll('.tabbar button').forEach(btn=>{
  btn.addEventListener('click', ()=>{
    if(btn.classList.contains('active')) closeTab(); else showTab(btn.dataset.tab);
  });
});

// 镖师头像池（6张真人风格图片）
const PORTraits = [
  'img/portraits/p01.jpeg',
  'img/portraits/p02.jpeg',
  'img/portraits/p03.jpeg',
  'img/portraits/p04.jpeg',
  'img/portraits/p05.jpeg',
  'img/portraits/p06.jpeg'
];

// ===== 状态 =====
let state = 'menu';
let silver, repute, day, biaojuLv;
let escorts = [];     // 镖师
let orders = [];      // 当前镖单
let goalRepute = 150; // 通关声望
let orderSeq = 0;
let adventureDeck = []; // 本赛季奇遇牌库（每局随机抽选，使路线不同）
let advSeen = {};       // 跨赛季累计完成过的奇遇 id
let advCompleted = 0;   // 本档完成奇遇次数
let advFavor = {};      // 阵营好感（跨赛季累计的「江湖记忆」）
let chainSpawned = {};  // 本赛季已触发的连锁阵营（每赛季重置）
let seasonContracts = []; // 本赛季契约（随机抽 3 条）
let contractDone = {};  // 本赛季已达成契约 id
let contractBonus = 0;  // 累计契约加成（重开新赛季时折算为额外传承）
let codexAch = {};      // 跨赛季累计达成的契约 id（江湖图鉴·收藏册）
let chronicle = [];     // 历代镖首年表（每代重开时压入一条快照，跨赛季累计）
let armory = {};      // 武器库 {weaponId: count}
let herbs = {};       // 药材库存 {herbId: count}
let gearOwned = {};   // 穿戴用品库 {gearId: count}
let gearStar = {};    // 锻造星级 {gearId: 星级}（独立于 getGear 的稀有度 star 字段）
let bgMode = 'hall';  // 'hall' | 'landscape' | 'battle'
let achieved = {};   // 已解锁成就
let branches = {};   // 分舵 {cityId: {silver, income, managerId}}
let secretStages = {};  // 秘籍境界 {escortId: {manualId: stage}}
let ownedPages = [];   // 秘籍残页
let factionRep = {};   // 势力好感
let sectRep = {};      // 门派声望 {sectId: rep}
let sectMissions = []; // 当日可接门派任务
let enemies = [];      // 仇家
let enemyThreatLevel = 0; // 仇家威胁等级（随应战递增）
let nemesisCleared = 0;   // 宿敌线：累计剿灭的势力数
let martialContestActive = false;
let martialContestResults = [];   // 武林大会战绩
let martialContestDay = 0;        // 最近一次武林大会天数
let seasonMode = null; // 'survival'|'speedrun'|'endless'
let escortCount = 0; // 赛季/无尽：累计成功送达趟数
// ===== 赛季传承（NG+ 重置后保留的永久加成）=====
let heritage = 0;          // 传承等级（重开赛季次数）
const HERITAGE_WULI = 8;   // 每级全局攻击根基
const HERITAGE_DEF = 4;    // 每级全局防御根基
const HERITAGE_TILI = 10;  // 每级全局体力上限加成
const HERITAGE_REWARD = 0.05; // 每级走镖报酬/声望 +5%
const NG_HP_PER = 0.08;   // NG+：每级传承敌人血量 +8%
const NG_ATK_PER = 0.05;  // NG+：每级传承敌人攻击 +5%
function heritageBonus(){
  return { wuli: heritage*HERITAGE_WULI, def: heritage*HERITAGE_DEF, tili: heritage*HERITAGE_TILI, reward: heritage*HERITAGE_REWARD };
}
// NG+ 难度缩放：敌人强度随传承等级放大（玩家也随传承变强，但敌人百分比增长制造真实压力）
function ngEnemyMul(){
  return { hp: 1 + heritage*NG_HP_PER, atk: 1 + heritage*NG_ATK_PER };
}
// 无尽模式阶段化：每 10 趟升一阶段（上限 8 阶），劫匪渐强、路途更险，报酬也随之上涨
function endlessPhase(){ return seasonMode==='endless' ? Math.min(8, 1 + Math.floor(escortCount/10)) : 0; }
const BRANCH_COST_BASE = 300;     // 开设分舵基础费用
const BRANCH_INCOME_BASE = 35;    // 分舵日基础收入
const MARTIAL_CONTEST_INTERVAL = 30; // 武林大会间隔天数
// 秘籍境界全局加成：每个境界 +3 武力（所有镖师共享）
function manualBonus(){ let s = 0; for(const k in secretStages) s += (secretStages[k]||0); return s * 3; }

const FIRST_NAMES = ['铁臂','飞燕','镇远','断魂','追风','霹雳','醉仙','卧云','金刀','银枪','神行','笑面'];

function escortEquippedIds(e){ if(!e || !e.gear) return []; return Object.keys(e.gear).map(function(k){ return e.gear[k]; }).filter(Boolean); }
function escortActiveSets(e){
  const eq = escortEquippedIds(e);
  return GEAR_SETS.filter(function(s){ return s.pieces.every(function(p){ return eq.indexOf(p) >= 0; }); });
}
function escortSetBonus(e){
  const sets = escortActiveSets(e);
  let wuli=0, def=0, tili=0;
  sets.forEach(function(s){ wuli += (s.bonus.wuli||0); def += (s.bonus.def||0); tili += (s.bonus.tili||0); });
  return { wuli:wuli, def:def, tili:tili, sets:sets };
}
function escortSetText(e){
  const sets = escortActiveSets(e);
  if(!sets.length) return '无';
  return sets.map(function(s){ return s.emoji + s.name + '（' + (s.bonus.wuli?('攻+'+s.bonus.wuli+'·'):'') + '防+'+s.bonus.def + (s.bonus.tili?('·体力+'+s.bonus.tili):'') + '）'; }).join('、');
}

const FORGE_MAX = 10;
// 升星后有效防御：每星 +12%
function gearEffDef(id){ const g=getGear(id); if(!g) return 0; const st=gearStar[id]||0; return Math.round(g.def * (1 + st*0.12)); }
// 升星消耗：银两随星级线性涨，药材每两星 +1 株
function forgeCost(id){ const st=gearStar[id]||0; return { silver: 200 + st*180, herb: 1 + Math.floor(st/2) }; }
function totalHerbs(){ return Object.keys(herbs).reduce(function(s,k){ return s + (herbs[k]||0); }, 0); }
function consumeHerbs(n){ let left=n; Object.keys(herbs).forEach(function(k){ if(left<=0) return; const take=Math.min(left, herbs[k]||0); herbs[k]-=take; left-=take; if((herbs[k]||0)<=0) delete herbs[k]; }); return left<=0; }

let bLevels = {};   // 建筑等级：{ account:0, drill:0, ... }
function bLvl(id){ return bLevels[id]||0; }
function buildingBonus(id){ const b = BUILDINGS.find(x=>x.id===id); return b ? b.val * bLvl(id) : 0; }
function buildingCost(id){ const b = BUILDINGS.find(x=>x.id===id); const l = bLvl(id); if(l >= b.max) return null; return Math.round(300 * Math.pow(1.7, l+1)); }
function canUpgradeBuilding(id){ return buildingCost(id) !== null; }
function upgradeBuilding(id){
  const b = BUILDINGS.find(x=>x.id===id); if(!b) return;
  const c = buildingCost(id);
  if(c === null){ toast('🏯 ' + b.name + ' 已是最高 ' + b.max + ' 级'); return; }
  if(silver < c){ toast('银两不足，升级 ' + b.name + ' 需 ' + c + ' 两'); return; }
  // 确认弹窗（无 DOM 环境 / 测试沙箱直接升级）
  if(hasDOM()){
    const confirmModal = document.createElement('div'); confirmModal.className='modal';
    confirmModal.innerHTML = '<div class="box"><h3>🏯 升级 ' + b.name + '</h3>'
      + '<p style="font-size:13px;color:#d8c8a8;line-height:1.6;">升级至 Lv.'+(bLvl(id)+1)+'，消耗 ' + c + ' 两。</p>'
      + '<p style="font-size:13px;color:#9be29b;">' + b.desc + '</p>'
      + '<div style="display:flex;gap:8px;margin-top:12px;"><button id="confirmUp" style="flex:1;padding:10px 0;border-radius:8px;background:linear-gradient(135deg,#7a5a2e,#a9803d);color:#fff;border:none;font-size:14px;cursor:pointer;">确认升级</button>'
      + '<button class="close" style="flex:1;padding:10px 0;border-radius:8px;background:#3a2c18;color:#c9b48c;border:none;font-size:14px;cursor:pointer;">取消</button></div></div>';
    document.getElementById('wrap').appendChild(confirmModal);
    confirmModal.querySelector('#confirmUp').onclick = ()=>{
      confirmModal.remove();
      silver -= c; bLevels[id] = bLvl(id) + 1;
      const nl = bLvl(id);
      unlockAch('build_first');
      if(BUILDINGS.every(function(x){ return bLvl(x.id) >= x.max; })) unlockAch('build_all');
      checkAchievements();
      renderAll();
      showResultModal('🏯 '+b.name+' 升级成功', '已升至 <b style="color:#ffd479;">Lv.'+nl+'</b><br><span style="color:#9be29b;">'+b.desc+'</span>');
    };
    confirmModal.querySelector('.close').onclick = ()=> confirmModal.remove();
  } else {
    // VM 沙箱测试环境：直接升级
    silver -= c; bLevels[id] = bLvl(id) + 1;
    unlockAch('build_first');
    if(BUILDINGS.every(function(x){ return bLvl(x.id) >= x.max; })) unlockAch('build_all');
    checkAchievements();
  }
}
function showBuildings(){
  const modal = document.createElement('div'); modal.className='modal';
  let h = '<div class="box"><div class="box-body"><h3>🏯 镖局建筑</h3>';
  h += '<p style="font-size:12px;color:#c9b48c;margin:4px 0 10px;">耗银两兴建与升级，建筑越高级，镖局营生越红火。升级效果永久生效。</p>';
  BUILDINGS.forEach(function(b){
    const l = bLvl(b.id), c = buildingCost(b.id);
    const maxed = c === null;
    const cur = (b.val * l * 100).toFixed(0);
    const nxt = (b.val * (l+1) * 100).toFixed(0);
    h += '<div class="storeItem"><div class="info"><b>' + b.emoji + ' ' + b.name + '</b> <small>Lv.' + l + '/' + b.max + ' · ' + b.desc + '</small>'
       + '<small>当前加成 ' + cur + '%' + (maxed ? '' : ' → 升级后 ' + nxt + '%') + '</small></div>';
    if(maxed) {
      h += '<span class="tag">已满级</span>';
    } else {
      h += '<button data-bid="' + b.id + '" class="buildUpBtn" style="font-size:12px;' + (silver < c ? 'opacity:.5;' : '') + '">' + (silver < c ? '需' + c + '两' : '升级（' + c + '两）') + '</button>';
    }
    h += '</div>';
  });
  h += '</div><div class="box-footer"><button class="close">关闭</button></div></div>';
  modal.innerHTML = h;
  modal.querySelector('.close').onclick = function(){ modal.remove(); };
  // 为所有建筑升级按钮添加事件监听
  modal.querySelectorAll('.buildUpBtn').forEach(function(btn){
    btn.onclick = function(){
      const id = this.getAttribute('data-bid');
      upgradeBuilding(id);
    };
  });
  document.getElementById('wrap').appendChild(modal);
}
// 通用结果弹窗（升级/派遣等操作的反馈）
// 无 DOM 环境（测试沙箱）判定：此类环境下跳过一切弹窗行为，只保留数据逻辑
function hasDOM(){
  if(typeof document === 'undefined' || !document.getElementById || !document.getElementById('wrap')) return false;
  if(typeof __noDOM !== 'undefined' && __noDOM) return false;
  if(typeof window !== 'undefined' && window.__noDOM) return false;
  return true;
}
function showResultModal(title, body){
  if(!hasDOM()) return;
  const modal = document.createElement('div'); modal.className='modal';
  modal.innerHTML = '<div class="box"><div class="box-body"><h3>'+title+'</h3><p style="font-size:13px;color:#d8c8a8;line-height:1.7;">'+body+'</p></div><div class="box-footer"><button class="close">关闭</button></div></div>';
  modal.querySelector('.close').onclick = function(){ modal.remove(); if(typeof onResumeModal==='function') onResumeModal(); };
  document.getElementById('wrap').appendChild(modal);
}
// 弹窗关闭回调：若有待恢复的走镖动画则自动续走，否则不做任何事
window.onResumeModal = function(){
  if(window._pendingResume){ const f = window._pendingResume; window._pendingResume = null; f(); }
};
// 操作成功后刷新所属列表弹窗：仅当该弹窗确实开着时才重开，无 DOM 环境自动跳过。
// 用途：列表弹窗内的操作（突破 / 派遣 / 出战 / 兑换）执行完必须让面板显示新数据，
//       否则界面停留在旧值——这类 stale bug 已连续三轮出现，故统一收口到此处。
function refreshModalIfOpen(keyword, reopen){
  if(!hasDOM()) return;
  let found = false;
  document.querySelectorAll('.modal').forEach(function(m){
    const t = m.querySelector('h3');
    if(t && t.textContent && t.textContent.indexOf(keyword) >= 0) found = true;
  });
  if(found) reopen();
}
function forgeGear(id){
  const g=getGear(id); if(!g) return;
  if((gearOwned[id]||0) <= 0){ toast('尚未拥有'+g.name); return; }
  const st=gearStar[id]||0;
  if(st >= FORGE_MAX){ toast(g.name+'已臻化境'); return; }
  let c = forgeCost(id);
  if(buildingBonus('armory') > 0){ c = { silver: Math.max(0, Math.round(c.silver * (1 - buildingBonus('armory')))), herb: c.herb }; } // 库房：锻造消耗折扣
  if(silver < c.silver){ toast('银两不足（需'+c.silver+'两）'); return; }
  if(totalHerbs() < c.herb){ toast('药材不足（需'+c.herb+'株）'); return; }
  silver -= c.silver; consumeHerbs(c.herb); gearStar[id] = st + 1;
  eventLog.unshift({ t:'锻造·'+g.name, day:(day||1), outcome:'淬炼至 '+starStr(gearStar[id])+'，防御 +'+gearEffDef(id) });
  if(eventLog.length > 30) eventLog.length = 30;
  toast('🔨 '+g.name+' 锻造至 '+starStr(gearStar[id])+'！防御 +'+gearEffDef(id));
  checkAchievements();
  renderAll(); renderStore('weapon');
}

function sectBuff(id){
  const lv = sectLevel(id);
  const b = { atk:0, def:0, flee:0, incomePct:0 };
  if(lv >= 1) b.atk += 2;            // 该兵路镖师攻击 +2
  if(lv >= 2) b.flee += 0.05;        // 撤退成功率 +5%
  if(lv >= 3){ b.def += 1; b.incomePct += 0.08; } // 全员防御 +1，分舵收入 +8%
  return b;
}
function sectSchoolAtk(schoolId){ const s = SECT_BY_ID[schoolId]; return s ? sectBuff(s.id).atk : 0; }
function totalSectIncomePct(){ let p = 0; SECTS.forEach(s=> p += sectBuff(s.id).incomePct); return p; }

function pickManualPage(){
  const fav = SECTS.filter(s=> sectLevel(s.id) >= 2);
  if(fav.length){
    const s = pick(fav);
    const pages = MANUAL_PAGES.filter(p=> p.manualId === s.id);
    if(pages.length) return pick(pages);
  }
  return pick(MANUAL_PAGES);
}

function genSectMissions(){
  sectMissions = [];
  const pool = SECTS.slice();
  const n = Math.min(3, pool.length);
  for(let i=0;i<n;i++){
    const idx = rnd(0, pool.length-1);
    const s = pool.splice(idx, 1)[0];
    const type = pick(['escort','hunt','gift']);
    const m = { id:'sm_'+day+'_'+i, sectId:s.id, type };
    if(type === 'escort'){ m.desc = '护送'+s.name+'重宝至'+pick(CITIES); m.rep = rnd(8,12); m.reward = rnd(110,180); m.threat = rnd(2,4); }
    else if(type === 'hunt'){ m.desc = '替'+s.name+'清剿'+pick(ENEMY_NAMES)+'余党'; m.rep = rnd(9,13); m.reward = rnd(90,150); m.threat = rnd(2,5); }
    else { m.desc = '向'+s.name+'捐献香火钱'; m.rep = rnd(5,8); m.cost = rnd(80,140); m.reward = 0; m.threat = 0; }
    sectMissions.push(m);
  }
}

// 每突破一境：抬高等级上限、永久加武力/防御根基、提高体力上限；越往上越贵。
const REALMS = [
  { name:'凡境',   cap:10, wuli:0,   def:0,  tili:0 },
  { name:'入境',   cap:20, wuli:22,  def:4,  tili:10 },

];
function realmCap(e){ return REALMS[clamp(e.realm||0,0,REALMS.length-1)].cap; }
function realmName(e){ return REALMS[clamp(e.realm||0,0,REALMS.length-1)].name; }
function realmBonus(e){ // 累计加成（不含凡境）
  let wuli=0, def=0, tili=0; const r = clamp(e.realm||0,0,REALMS.length-1);
  for(let i=1;i<=r;i++){ wuli += REALMS[i].wuli; def += REALMS[i].def; tili += REALMS[i].tili; }
  return { wuli:wuli, def:def, tili:tili };
}
function canBreakthrough(e){ return (e.realm||0) < REALMS.length-1 && (e.lv||1) >= realmCap(e); }
function breakthroughCost(e){ const t = (e.realm||0)+1; return { silver: Math.round(800*Math.pow(1.9,t)), repute: 12*t*t }; }
function doBreakthrough(e){
  // 弟子面板的按钮传进来的是镖师 id 字符串，这里统一转成对象
  if(typeof e === 'string') e = escorts.find(x=> x.id === e);
  if(!e) return;
  if(!canBreakthrough(e)){ toast('暂不可突破'); return; }
  const c = breakthroughCost(e);
  if(silver < c.silver){ toast('银两不足（需 '+c.silver+' 两）'); return; }
  if(repute < c.repute){ toast('声望不足（需 '+c.repute+'）'); return; }
  silver -= c.silver; repute -= c.repute;
  e.realm = (e.realm||0) + 1;
  e.maxTili = (e.maxTili||100) + REALMS[e.realm].tili;
  e.tili = e.maxTili;
  const g = REALMS[e.realm];
  toast('🌟 '+e.name+' 突破至【'+g.name+'】！武力根基 +'+g.wuli+' · 防御 +'+g.def+' · 体力上限 +'+g.tili);
  unlockAch('breakthrough_1');
  if(e.realm >= 3) unlockAch('breakthrough_master');
  if(e.realm >= 4) unlockAch('breakthrough_grand');
  checkAchievements();
  renderAll();
  // 突破是在「镖局弟子」面板里点的，不重开面板会一直显示旧境界与旧突破价格
  refreshModalIfOpen('镖局弟子', function(){ showDisciples(); });
}

function weatherOfDay(d){
  let h = ((d || 1) * 2654435761) >>> 0;
  h = (h ^ (h >>> 13)) >>> 0;
  const roll = h % 100;
  let acc = 0;
  for(const w of WEATHERS){ acc += w.w; if(roll < acc) return w; }
  return WEATHERS[0];
}
function todayWeather(){ return weatherOfDay(day || 1); }

  heritage += 1 + contractBonus; contractBonus = 0; // 契约加成折算为额外传承

  chronicle.push(makeGenEntry(chronicle.length + 1));

  var _meta = { heritage: heritage, codexAch: codexAch, advSeen: advSeen, advFavor: advFavor, beasts: beasts, beastBound: beastBound, achieved: achieved, chronicle: chronicle };

  contractDone = {}; seedSeasonContracts();
  herbs = { h_jin: 2 };
  gearOwned = {}; gearStar = {};

  // 可能在赛季初因偶然的随机契约达成而修改 codexAch，破坏跨赛季累计的纯净性。

// 存档 / 读档（多槽：3 手动槽 + 自动槽）
function slotKey(s){ return 'biaoju_slot_' + currentUser + '_' + s; }
function makeSaveData(){ return { v:3, ts:Date.now(), silver, repute, day, biaojuLv, goalRepute, orderSeq, escorts, orders, armory, herbs, gearOwned, gearStar, achieved, state, branches, secretStages, ownedPages, factionRep, sectRep, sectMissions, enemies, seasonMode, martialContestResults, martialContestDay, enemyThreatLevel, nemesisCleared, escortCount, eventLog, lastEventIdx, sideQuests, campaignLevel, campaignDeliveries, beasts, beastBound, dungeonCd, dungeonCleared, dungeonClearedSet, tourneyCd, tourneyWins, bLevels, heritage, adventureDeck, advSeen, advCompleted, advFavor, chainSpawned, seasonContracts, contractDone, contractBonus, codexAch, chronicle: chronicle.slice() }; }
function saveGameToSlot(s){
  if(!currentUser || currentUser === '__guest__'){ if(currentUser === '__guest__') toast('游客模式不存档'); return; }
  localStorage.setItem(slotKey(s), JSON.stringify(makeSaveData()));
  toast('💾 已存入存档槽 ' + (s === 'auto' ? '（自动）' : s));
}
function applySave(d){
  silver = d.silver; repute = d.repute; day = d.day; biaojuLv = d.biaojuLv;
  goalRepute = d.goalRepute; orderSeq = d.orderSeq;
  escorts = d.escorts; orders = d.orders; armory = d.armory; herbs = d.herbs || {}; gearOwned = d.gearOwned || {}; gearStar = d.gearStar || {};
  achieved = d.achieved || {}; state = d.state || 'playing';
  branches = d.branches || {}; secretStages = d.secretStages || {};
  ownedPages = d.ownedPages || []; factionRep = d.factionRep || {};
  enemies = d.enemies || []; seasonMode = d.seasonMode || null;
  nemesisCleared = d.nemesisCleared || 0;
  enemies.forEach(x=>{ if(typeof x.threat!=='number') x.threat = 1; if(!x.name) x.name = '无名匪寨'; });
  sectRep = d.sectRep || {}; sectMissions = d.sectMissions || [];
  martialContestResults = d.martialContestResults || []; martialContestDay = d.martialContestDay || 0;
  enemyThreatLevel = d.enemyThreatLevel || 0;
  escortCount = d.escortCount || 0;
  dungeonCd = d.dungeonCd || {}; dungeonCleared = d.dungeonCleared || 0; dungeonClearedSet = d.dungeonClearedSet || {};
  tourney = d.tourney || null; tourneyCd = d.tourneyCd || 0; tourneyWins = d.tourneyWins || 0;
  bLevels = d.bLevels || {};
  heritage = d.heritage || 0;
  adventureDeck = d.adventureDeck || []; advSeen = d.advSeen || {}; advCompleted = d.advCompleted || 0;
  advFavor = d.advFavor || {}; chainSpawned = d.chainSpawned || {};
  seasonContracts = d.seasonContracts || []; contractDone = d.contractDone || {}; contractBonus = d.contractBonus || 0;
  codexAch = d.codexAch || {};
  chronicle = Array.isArray(d.chronicle) ? d.chronicle.filter(function(g){ return g && typeof g.gen === 'number'; }) : [];
  Object.keys(contractDone).forEach(function(k){ if(contractDone[k]) codexAch[k] = true; }); // 旧档：已达成契约回填图鉴
  if(!adventureDeck.length) seedAdventureDeck(); // 旧档无牌库则补抽
  if(!seasonContracts.length) seedSeasonContracts(); // 旧档无契约则补抽
  // 兼容旧版本：数组形式的武器/防具库转为数量映射
  if(Array.isArray(armory)){ const m={}; armory.forEach(id=> m[id]=(m[id]||0)+1); armory=m; }
  if(Array.isArray(gearOwned)){ const m={}; gearOwned.forEach(id=> m[id]=(m[id]||0)+1); gearOwned=m; }
  escorts.forEach(e=>{ const gg=(e.gear&&typeof e.gear==='object'&&!Array.isArray(e.gear))?e.gear:{}; e.gear=gg; if(e.weapon===undefined) e.weapon=null; if(!e.talent||typeof e.talent!=='object') e.talent={}; if(typeof e.tp!=='number') e.tp=0; if(typeof e.realm!=='number') e.realm=0; if(typeof e.maxTili!=='number') e.maxTili=100; });
  eventLog = d.eventLog || []; lastEventIdx = -1;
  sideQuests = d.sideQuests || [];
  campaignLevel = d.campaignLevel || 0;
  campaignDeliveries = d.campaignDeliveries || 0;
  beasts = d.beasts || {}; beastBound = d.beastBound || {};
  renderAll();
}

// 导出存档：找最新非空槽 → JSON → base64 → 弹框带 textarea + 复制按钮
// 用途：升级 APK 前先导出（复制到任何地方），装新版后粘贴回来恢复进度
function exportSave(){
  const slots = ['1','2','3','auto'];
  let data = null, slotName = 'auto';
  for(const s of slots){
    const raw = localStorage.getItem(slotKey(s));
    if(raw){ try{ const d = JSON.parse(raw); if(!data || (d.ts||0) > (data.ts||0)){ data = d; slotName = s; } }catch(e){} }
  }
  if(!data){ toast('暂无存档可导出（请先开始一局并让自动存档触发）'); return; }
  let b64;
  try{ b64 = btoa(unescape(encodeURIComponent(JSON.stringify(data)))); }
  catch(e){ toast('导出失败：' + e.message); return; }
  const m = document.createElement('div'); m.className = 'modal';
  m.innerHTML = '<div class="box"><h3>📤 导出存档</h3>'
    + '<p style="font-size:12px;color:#c9b48c;line-height:1.6;margin:0 0 8px;">来源：<b>' + (slotName==='auto'?'自动存档':'存档槽 '+slotName) + '</b>（' + new Date(data.ts).toLocaleString() + '）。长按框内全选手动复制，或点「📋 复制」按钮（部分浏览器/WebView 需手动复制）。把编码粘贴到「📥 导入存档」可恢复进度。</p>'
    + '<textarea id="expTA" readonly style="width:100%;height:120px;font-size:10px;font-family:monospace;padding:8px;background:#1c150c;color:#ffd479;border:1px solid #6b4f2a;border-radius:8px;word-break:break-all;resize:vertical;">' + b64 + '</textarea>'
    + '<div class="box-footer"><button id="cpBtn" style="flex:1;">📋 复制</button><button class="close" style="flex:1;">关闭</button></div></div>';
  el('wrap').appendChild(m);
  m.querySelector('.close').onclick = function(){ m.remove(); };
  m.querySelector('#cpBtn').onclick = function(){
    const ta = m.querySelector('#expTA'); ta.select();
    try{
      if(navigator.clipboard && navigator.clipboard.writeText){
        navigator.clipboard.writeText(b64).then(()=>toast('已复制到剪贴板'), function(){ document.execCommand('copy'); toast('已复制（兼容模式）'); });
      } else { document.execCommand('copy'); toast('已复制'); }
    }catch(e){ toast('请长按文本框全选手动复制'); }
  };
}

// 导入存档：弹框让用户粘贴 base64 编码 → 解析 → 写入指定槽
// 覆盖目标槽的内容（不直接覆盖当前进度，需在「读档」选择该槽生效）
function importSave(){
  const m = document.createElement('div'); m.className = 'modal';
  m.innerHTML = '<div class="box"><h3>📥 导入存档</h3>'
    + '<p style="font-size:12px;color:#c9b48c;line-height:1.6;margin:0 0 8px;">粘贴之前导出的存档编码到下方框，选个槽位确认。导入只写入目标槽，不直接覆盖当前进度；要在「📂 读档」选该槽才生效。<font color="#ff8a7a">会覆盖目标槽已有内容</font>。</p>'
    + '<textarea id="impTA" placeholder="在此粘贴存档编码..." style="width:100%;height:100px;font-size:10px;font-family:monospace;padding:8px;background:#1c150c;color:#ffd479;border:1px solid #6b4f2a;border-radius:8px;word-break:break-all;resize:vertical;"></textarea>'
    + '<div style="display:flex;gap:6px;margin-top:8px;align-items:center;"><span style="font-size:12px;color:#c9b48c;">导入到：</span>'
    + '<select id="impSlot" style="flex:1;padding:6px;background:#1c150c;color:#f3e9d2;border:1px solid #6b4f2a;border-radius:6px;">'
    + '<option value="1">存档槽 1</option><option value="2">存档槽 2</option><option value="3">存档槽 3</option><option value="auto">自动存档</option></select></div>'
    + '<div class="box-footer"><button id="impGoBtn" class="danger" style="flex:1;">📥 确认导入</button><button class="close" style="flex:1;">取消</button></div></div>';
  el('wrap').appendChild(m);
  m.querySelector('.close').onclick = function(){ m.remove(); };
  m.querySelector('#impGoBtn').onclick = function(){
    const text = m.querySelector('#impTA').value.trim();
    if(!text){ toast('请粘贴存档编码'); return; }
    let data;
    try { data = JSON.parse(decodeURIComponent(escape(atob(text)))); }
    catch(e){ toast('编码格式错误，请检查是否完整粘贴：' + e.message); return; }
    if(typeof data !== 'object' || data.silver === undefined){ toast('存档数据无效（缺银两字段）'); return; }
    const slot = m.querySelector('#impSlot').value;
    try { localStorage.setItem(slotKey(slot), JSON.stringify(data)); }
    catch(e){ toast('写入失败：' + e.message); return; }
    m.remove();
    toast('✅ 已导入到' + (slot==='auto'?'自动存档':'存档槽 '+slot) + '，去「📂 读档」选该槽生效');
  };
}

// ===== 战斗音效（WebAudio 合成，零外部资源）=====
let sfxAc = null;
function ensureSfx(){
  try {
    if(!sfxAc){ sfxAc = new (window.AudioContext || window.webkitAudioContext)(); }
    if(sfxAc && sfxAc.state === 'suspended') sfxAc.resume();
  } catch(e){ sfxAc = null; }
  return sfxAc;
}
function sfxTone(freq, dur, type, vol, slideTo){
  const ac = ensureSfx(); if(!ac) return;
  const t = ac.currentTime;
  const o = ac.createOscillator(); const g = ac.createGain();
  o.type = type || 'square';
  o.frequency.setValueAtTime(freq, t);
  if(slideTo) o.frequency.exponentialRampToValueAtTime(Math.max(1, slideTo), t + dur);
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(vol || 0.2, t + 0.012);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g); g.connect(ac.destination);
  o.start(t); o.stop(t + dur + 0.03);
}
function sfxNoise(dur, vol){
  const ac = ensureSfx(); if(!ac) return;
  const t = ac.currentTime;
  const n = ac.createBufferSource();
  const buf = ac.createBuffer(1, Math.max(1, Math.floor(ac.sampleRate * dur)), ac.sampleRate);
  const dat = buf.getChannelData(0);
  for(let i=0;i<dat.length;i++) dat[i] = (Math.random()*2 - 1) * (1 - i/dat.length);
  n.buffer = buf;
  const lp = ac.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 1400;
  const g = ac.createGain();
  g.gain.setValueAtTime(vol || 0.14, t);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  n.connect(lp); lp.connect(g); g.connect(ac.destination);
  n.start(t); n.stop(t + dur);
}
function playSfx(type){
  switch(type){
    case 'attack': sfxTone(520, 0.10, 'square', 0.16, 300); sfxNoise(0.07, 0.08); break;
    case 'crit':   sfxTone(740, 0.14, 'sawtooth', 0.22, 240); sfxNoise(0.12, 0.15); break;
    case 'hit':    sfxTone(150, 0.16, 'triangle', 0.24, 90); sfxNoise(0.10, 0.13); break;
    case 'heal':   sfxTone(440, 0.18, 'sine', 0.16, 660); break;
    case 'flee':   sfxTone(300, 0.16, 'sine', 0.15, 520); break;
    case 'win':    sfxTone(523,0.12,'square',0.18); setTimeout(function(){ sfxTone(659,0.12,'square',0.18); },120); setTimeout(function(){ sfxTone(784,0.22,'square',0.18); },240); break;
    case 'lose':   sfxTone(392,0.20,'triangle',0.18,200); setTimeout(function(){ sfxTone(294,0.32,'triangle',0.18,150); },170); break;
    case 'boss':   sfxTone(92,0.9,'sawtooth',0.28,70); sfxTone(140,0.9,'square',0.12); break;
    default: sfxTone(360, 0.05, 'square', 0.10);
  }
}

// ===== 战斗特效系统 =====
function roundRect(x, y, w, h, r){
  cctx.beginPath();
  cctx.moveTo(x+r, y);
  cctx.arcTo(x+w, y, x+w, y+h, r);
  cctx.arcTo(x+w, y+h, x, y+h, r);
  cctx.arcTo(x, y+h, x, y, r);
  cctx.arcTo(x, y, x+w, y, r);
  cctx.closePath();
}
function drawPortraitCard(img, corner, name, sub, color){
  const size = Math.max(120, Math.min(CWW, CWH) * 0.24);
  const pad = 14;
  const y = pad + (Math.sin((combat ? combat.tick : 0) * 2.2) * 4);
  const x = corner === 'left' ? pad : CWW - size - pad;
  cctx.save();
  roundRect(x, y, size, size * 1.15, 12);
  cctx.fillStyle = 'rgba(20,15,8,0.82)'; cctx.fill();
  cctx.lineWidth = 3; cctx.strokeStyle = color; cctx.stroke();
  if(img && img.complete && img.naturalWidth){
    cctx.save(); roundRect(x, y, size, size * 1.15, 12); cctx.clip();
    cctx.drawImage(img, x, y, size, size * 1.15);
    cctx.restore();
    cctx.fillStyle = 'rgba(20,15,8,0.55)';
    cctx.fillRect(x, y + size*0.82, size, size*0.33);
  } else {
    cctx.fillStyle = '#3a2c18'; cctx.fillRect(x, y, size, size*1.15);
  }
  cctx.fillStyle = '#ffd479'; cctx.font = 'bold 14px sans-serif'; cctx.textAlign = 'center';
  cctx.fillText(name, x + size/2, y + size*1.15 - 10);
  cctx.fillStyle = '#d8c8a8'; cctx.font = '11px sans-serif';
  cctx.fillText(sub, x + size/2, y + size*1.15 - 26);
  cctx.restore();
}
function spawnHitFx(who, crit){
  if(!combat) return;
  const X = who === 'enemy' ? CWW * 0.80 : CWW * 0.20;
  const Y = CWH * 0.32;
  combat.fx.push({ type:'slash', x:X, y:Y, t:0, life:0.35, crit:!!crit });
  combat.fx.push({ type:'spark', x:X, y:Y, t:0, life:0.5, color: who==='enemy' ? '#ffce54' : '#e0533b' });
  combat.fx.push({ type:'flash', x:X, y:Y, t:0, life:0.3, r: (who==='enemy' ? CWW*0.22 : CWW*0.18), color: who==='enemy' ? '#ffce54' : '#e0533b' });
  combat.shake = Math.max(combat.shake || 0, (crit || (combat && combat.boss)) ? 12 : 6);
}
function spawnHealFx(){
  if(!combat) return;
  const X = CWW * 0.20, Y = CWH * 0.32;
  combat.fx.push({ type:'flash', x:X, y:Y, t:0, life:0.45, r:CWW*0.18, color:'#5fd36a' });
  for(let i=0;i<8;i++) combat.fx.push({ type:'spark', x:X, y:Y, t:0, life:0.7, color:'#9be8a0', spread:true });
}
function drawFx(){
  combat.fx.forEach(f=>{
    const k = f.t / f.life;
    if(f.type === 'slash'){
      cctx.save(); cctx.globalAlpha = 1 - k;
      cctx.strokeStyle = f.crit ? '#ffffff' : '#ffce54'; cctx.lineWidth = f.crit ? 10 : 6;
      const a0 = -0.9 + k * 1.6;
      cctx.beginPath(); cctx.arc(f.x, f.y, 46 + (f.crit ? 16 : 0), a0, a0 + 0.9); cctx.stroke();
      cctx.restore();
    } else if(f.type === 'spark'){
      cctx.save(); cctx.globalAlpha = 1 - k;
      for(let i=0;i<10;i++){
        const ang = (i/10) * Math.PI * 2 + (f.spread ? 0 : k);
        const dist = 20 + k * (f.spread ? 70 : 46);
        cctx.fillStyle = f.color; cctx.beginPath();
        cctx.arc(f.x + Math.cos(ang)*dist, f.y + Math.sin(ang)*dist, 3*(1-k)+1, 0, Math.PI*2); cctx.fill();
      }
      cctx.restore();
    } else if(f.type === 'flash'){
      cctx.save(); cctx.globalAlpha = (1 - k) * 0.5;
      const g = cctx.createRadialGradient(f.x, f.y, 0, f.x, f.y, f.r);
      g.addColorStop(0, f.color); g.addColorStop(1, 'rgba(0,0,0,0)');
      cctx.fillStyle = g; cctx.beginPath(); cctx.arc(f.x, f.y, f.r, 0, Math.PI*2); cctx.fill();
      cctx.restore();
    }
  });
}

// 灵兽主动技：每场战斗限用一次，各兽效果互不相同；成年期数值 ×1.2，灵兽期 ×1.4
const BEAST_ACTS = {
  b_huang:  { label:'犬吠破胆', desc:'震慑敌胆，眩晕 1 回合' },

let beasts = {};      // id -> { bond, stage }

// ===== 镖师天赋树：每升一级得 1 点，五系分流形成 build 差异 =====
// 25 点点满（每系 5 级），镖师需练到 Lv.25 方能全通，构成长线培养目标
const TALENTS = [
  { id:'t_atk',  name:'刀锋', emoji:'🗡️', max:5, desc:'每级攻击 +3',        unit:'攻+3' },

];
const TALENT_BY_ID = {}; TALENTS.forEach(function(t){ TALENT_BY_ID[t.id] = t; });

function talentLv(e, id){ return (e && e.talent && e.talent[id]) || 0; }
function talentSpent(e){ if(!e) return 0; let s = 0; TALENTS.forEach(function(t){ s += talentLv(e, t.id); }); return s; }
function talentPoint(e){ return (e && typeof e.tp === 'number') ? e.tp : 0; }

// 打开天赋面板
function openTalentPanel(escortId){
  const e = escorts.find(function(x){ return x.id === escortId; });
  if(!e) return;
  const modal = document.createElement('div'); modal.className = 'modal';
  const render = function(){
    const tp = talentPoint(e);
    let h = '<div class="box"><div class="box-body"><h3>🌳 ' + e.name + ' · 天赋</h3>';
    h += '<p style="font-size:12px;color:#c9b48c;margin:4px 0 10px;">剩余天赋点：<b style="color:#ffd479;font-size:15px;">' + tp + '</b>　已投入 ' + talentSpent(e) + ' 点　Lv.' + e.lv + '</p>';
    TALENTS.forEach(function(t){
      const lv = talentLv(e, t.id);
      const full = lv >= t.max;
      const canUp = tp > 0 && !full;
      // 等级点：实心表示已点
      let dots = '';
      for(let i = 0; i < t.max; i++) dots += (i < lv ? '●' : '○');
      h += '<div class="storeItem"><div class="info">'
        + '<b>' + t.emoji + ' ' + t.name + ' <small style="color:#c9b48c;">' + dots + '</small></b>'
        + '<small>' + t.desc + '　当前：' + (lv > 0 ? '<span style="color:#8fd68f;">' + t.unit + ' ×' + lv + '</span>' : '<span style="color:#888;">未点</span>') + '</small>'
        + '</div>'
        + (full ? '<span class="tag">已满</span>'
                : '<button onclick="learnTalent(\'' + e.id + '\',\'' + t.id + '\')" style="font-size:12px;' + (canUp ? '' : 'opacity:.45;') + '"' + (canUp ? '' : ' disabled') + '>修习</button>')
        + '</div>';
    });
    h += '<p style="font-size:11px;color:#8a7a58;margin-top:10px;line-height:1.5;">每升一级得 1 点天赋点。刀锋主战、铁骨主守、内功主绝技、行脚主财、脚程主续航——专精一系远比平分更有效。</p>';
    h += '</div><div class="box-footer"><button class="close">关闭</button></div></div>';
    modal.innerHTML = h;
    modal.querySelector('.close').onclick = function(){ modal.remove(); };
  };
  render();
  // 供 learnTalent 回调刷新
  modal._render = render;
  document.getElementById('wrap').appendChild(modal);
}

function learnTalent(escortId, talentId){
  const e = escorts.find(function(x){ return x.id === escortId; });
  const t = TALENT_BY_ID[talentId];
  if(!e || !t) return;
  const lv = talentLv(e, talentId);
  if(lv >= t.max){ toast('此系已臻圆满'); return; }
  if(talentPoint(e) <= 0){ toast('暂无天赋点，需再升一级'); return; }
  if(!e.talent) e.talent = {};
  e.talent[talentId] = lv + 1;
  e.tp = talentPoint(e) - 1;
  playSfx('click');
  toast('🌳 ' + e.name + ' 修习「' + t.name + '」至 ' + e.talent[talentId] + ' 级');
  // 刷新所有打开的弹窗（找到含天赋面板的 modal 重绘）
  const mods = document.querySelectorAll('.modal');
  mods.forEach(function(md){ if(md._render) md._render(); });
  renderAll();
}

function beastOf(e){
  const id = e && beastBound[e.id];
  if(!id || !beasts[id]) return null;
  const B = BEASTS.find(function(x){ return x.id === id; });
  if(!B) return null;
  const st = clamp(beasts[id].stage || 1, 1, 3);
  return { B: B, st: st, bond: beasts[id].bond || 0 };
}
function beastAuraVal(e, type){
  const b = beastOf(e);
  if(!b || b.B.aura.type !== type) return 0;
  return b.B.aura.vals[b.st-1] || 0;
}
function beastNameOf(e){
  const b = beastOf(e);
  return b ? (b.B.emoji + ' ' + b.B.name + '（' + BEAST_STAGE_NAMES[b.st-1] + '）') : null;
}
function grantBeast(id, why){
  if(beasts[id]) return;
  const B = BEASTS.find(function(x){ return x.id === id; });
  if(!B) return;
  beasts[id] = { bond: 0, stage: 1 };
  toast('🐾 灵兽驾到！' + B.emoji + ' ' + B.name + '（' + why + '）');
  trySave();
}
function renderBeastTab(){

      h += '<br><small>✨ ' + B.aura.name + ' ' + auraNow + (boundE ? ' · 随行：🐎 ' + boundE.name : ' · <span style="color:#e0a353">未绑定镖师，光环不生效</span>') + '</small>';

      h += '</div><div style="display:flex;gap:6px;flex-direction:column">';
      h += '<button data-bfeed="' + B.id + '">🍖 喂养</button>';
      h += boundE ? '<button data-bunbind="' + B.id + '" class="danger">解绑</button>' : '<button data-bbind="' + B.id + '">绑定</button>';
      h += '</div></div>';
    } else {
      h += '<div class="storeItem" data-bview="' + B.id + '"><div class="info"><b style="color:#8a7a58">❔ ' + B.emoji + ' 未结缘灵兽</b><br><small style="color:#8a7a58">获取途径：' + B.src + '</small><br><small style="color:#8a7a58">光环：' + B.aura.name + '</small></div><span class="tag">🔒未结缘</span></div>';
    }
  });
  return h;
}
function feedBeast(id){
  const o = beasts[id]; if(!o) return;
  const B = BEASTS.find(function(x){ return x.id === id; });
  if(o.stage >= 3 && o.bond >= 100){ toast(B.name + ' 亲密度已圆满'); return; }
  // 喂养消耗：15两 + 任意药材1个；无药材则需30两
  let herbKey = Object.keys(herbs).find(function(k){ return (herbs[k]||0) > 0; });
  const cost = herbKey ? 15 : 30;
  if(silver < cost){ toast('银两不足，需 ' + cost + '两'); return; }
  silver -= cost;
  if(herbKey){ herbs[herbKey]--; if(herbs[herbKey] <= 0) delete herbs[herbKey]; }
  const add = rnd(8, 14);
  o.bond = Math.min(100, o.bond + add);
  let msg = B.emoji + ' ' + B.name + ' 吃得欢（亲密 +' + add + '）';
  if(o.stage < 3 && o.bond >= BEAST_BOND_STAGES[o.stage]){
    o.stage++;
    msg += ' · 进阶到' + BEAST_STAGE_NAMES[o.stage-1] + '！光环增强：' + B.aura.name + ' ' + B.aura.fmt(B.aura.vals[o.stage-1]);
  }
  toast('🐾 ' + msg);
  renderAll(); renderStore('beast');
}
function bindBeastPicker(beastId){

function unbindBeast(beastId){

  toast('🐾 ' + B.name + ' 回图鉴休憩（可重新绑定）');
  renderStore('beast');
}

// ===== 选择镖师 =====
function chooseEscort(order){
  const avail = escorts.filter(e=>!e.busy && e.tili>=20);
  if(avail.length===0){ toast('没有可派遣的镖师，先休整或招募'); return; }
  const modal = document.createElement('div');
  modal.className = 'modal';
  let html = `<div class="box"><h3>派遣哪位镖师走「${order.name}」？</h3><div class="box-body">`;
  avail.forEach(e=>{
    const fit = e.wuli>=order.need ? '✅够格' : '⚠️勉强';
    html += `<div class="opt" data-id="${e.id}">
      <div style="display:flex;align-items:center;gap:12px;">
        <img src="${e.portrait}" style="width:48px;height:48px;border-radius:50%;object-fit:cover;border:2px solid #6b4f2a;">
        <div>🐎 ${e.name} <small>Lv.${e.lv}</small><br><small>武力 ${e.wuli} · 体力 ${e.tili}</small><br><small>兵路 ${schoolName(e.school)} · 兵器 ${e.weapon?getWeapon(e.weapon).name:'徒手'}</small><br><small>特质 ${e.trait?e.trait.name:'—'}</small></div>
      </div>
      <div>${fit}</div></div>`;
  });
  html += `</div><div class="box-footer"><button class="close">取消</button></div></div>`;
  modal.innerHTML = html;
  modal.querySelector('.close').onclick = ()=>modal.remove();
  modal.querySelectorAll('.opt').forEach(op=>{
    op.onclick = ()=>{ modal.remove(); startEscort(order, avail.find(e=>e.id===op.dataset.id)); };
  });

// ===== 走镖动画 + 结算 =====
const ecv = document.getElementById('escort'), ectx = ecv.getContext('2d');
let escortAnim = null;
function resizeEscortCanvas(){
  ecv.width = window.innerWidth;
  ecv.height = _appVisibleH();
}
resizeEscortCanvas();
window.addEventListener('resize', resizeEscortCanvas);

function startEscort(order, e){
  e.busy = true; renderOrders();
  // 出镖抉择：官道稳妥绕远，山道抄近冒险；天气不同，账也不同
  const w = todayWeather();
  const roadModal = document.createElement('div'); roadModal.className = 'modal';
  roadModal.innerHTML = '<div class="box"><h3>🧭 出镖抉择 · 押往'+((order.name.match(/至(.+)$/)||[])[1]||'远方')+'</h3>'
    + '<p style="font-size:13px;color:#d8c8a8;">今日 '+w.emoji+' '+w.name+' —— '+w.desc+'</p>'
    + '<div class="opt" data-road="road"><div><b>🛣️ 官道</b><small>平安率 +8%，行程 +15%，稳妥绕远</small></div></div>'
    + '<div class="opt" data-road="mountain"><div><b>⛰️ 山道</b><small>平安率 -10%，行程 -20%，报酬 +12%，沿途更多事</small></div></div>'
    + '<div class="box-footer"><button class="close">按老规矩走官道</button></div></div>';
  roadModal.querySelectorAll('.opt').forEach(op=> op.onclick = ()=>{ roadModal.remove(); beginTravel(op.dataset.road === 'mountain' ? 'mountain' : 'road'); });
  roadModal.querySelector('.close').onclick = ()=>{ roadModal.remove(); beginTravel('road'); };
  document.getElementById('wrap').appendChild(roadModal);

  function beginTravel(road){
  bgMode = 'landscape';
  setSceneBGM('travel');
  document.getElementById('escortLayer').classList.remove('hidden');
  resizeEscortCanvas();

  const ww = ecv.width, wh = ecv.height;
  const scale = ww / 480;

  const ph = endlessPhase();
  // 设计：走镖抵达前必遭劫匪拦截并强制战斗（见 frame 终点分支），故不再用概率直接判定“被劫”。
  // 官道/山道的稳妥差异改由下方 threat 体现（山道 threat+1），影响拦截战难度。
  order._roadReward = road==='mountain' ? 1.12 : 1;
  const destCity = (order.name.match(/至(.+)$/)||[])[1] || pick(CITIES);
  const pool = CITIES.filter(c=>c!==destCity);
  const mid1 = pool[rnd(0,pool.length-1)];
  const pool2 = pool.filter(c=>c!==mid1);
  const mid2 = pool2[rnd(0,pool2.length-1)];
  const nodes = [
    {name:'威远镖局', x:64*scale, y:wh*0.25},
    {name:mid1,      x:ww*0.36, y:wh*0.50},
    {name:mid2,      x:ww*0.67, y:wh*0.40},
    {name:destCity,  x:ww*0.85, y:wh*0.70}
  ];
  // 时间过程：按里程与威胁推算走镖耗时（真实的时间推移）；无尽高阶段视为威胁上浮
  const threat = order.threat + (ph>1 ? Math.floor((ph-1)/2) : 0) + (road==='mountain' ? 1 : 0);
  const dur = Math.round((5200 + order.miles*7 + threat*500) * (road==='mountain' ? 0.8 : 1.15));
  // 沿途突发情况 / 支线任务：按威胁随机 1~3 起，分布在不同进度点
  const encCount = order.adventure ? 1 : rnd(2, 1 + Math.min(3, threat));
  const enc = []; const usedPos = {};
  for(let i=0;i<encCount;i++){
    let pos, tries=0;
    do { pos = 0.22 + Math.random()*0.55; tries++; } while(usedPos[pos.toFixed(2)] && tries<12);
    usedPos[pos.toFixed(2)] = 1;
    enc.push({ pos: Math.min(0.82, pos), done:false, fired:false });
  }
  enc.sort((a,b)=> a.pos - b.pos);
  window.travel = { order, e, nodes, ww, wh, scale, t0:performance.now(), dur, enc, ended:false };

  function showTravelEvent(ev){
    const te = order.adventure ? ADVENTURES_BY_ID[order.adventure] : TRAVEL_EVENTS[rnd(0, TRAVEL_EVENTS.length-1)];
    const modal = document.createElement('div'); modal.className='modal';
    let html = '<div class="box"><h3>📍 走镖途中 · '+te.t+'</h3>';
    html += '<p style="font-size:13px;color:#d8c8a8;line-height:1.6;margin:8px 0;">'+te.d+'</p>';
    te.a.forEach((c,i)=> html += '<div class="opt" data-i="'+i+'"><div>'+c.label+'</div></div>');
    html += '<div class="box-footer"><button class="close">静观其变</button></div></div>';
    modal.innerHTML = html;
    modal.querySelector('.close').onclick = ()=>{ ev.done = true; modal.remove(); resumeTravel(ev); };
    modal.querySelectorAll('.opt').forEach(op=> op.onclick = ()=>{
      window._pendingResume = null; // 清掉上一次遗留的恢复钩子
      const c = te.a[parseInt(op.dataset.i,10)];
      const msg = c.f ? c.f() : '';
      // 奇遇阵营好感：有利选择累积「江湖记忆」，达标触发专属连锁镖
      if(te.id && ADV_FACTION[te.id]){ const _f = ADV_FACTION[te.id]; advFavor[_f] = (advFavor[_f]||0) + 1; onFactionFavor(_f); }
      if(c.combat){ modal.remove(); startCombat(order, e); return; } // 迎战 → 进入战斗，战斗结束直接结算
      ev.done = true; modal.remove();
      if(msg){
        showResultModal('📍 '+te.t, msg);
        renderAll();
        // 走镖动画保持暂停，结果弹窗关闭时经 onResumeModal → _pendingResume 自动续走
        window._pendingResume = ()=>{ travel.t0 = performance.now() - ev.pos*travel.dur; travel.raf = requestAnimationFrame(frame); };
      } else { resumeTravel(ev); }
    });
    document.getElementById('wrap').appendChild(modal);
  }
  function resumeTravel(ev){
    travel.t0 = performance.now() - ev.pos*travel.dur;
    travel.raf = requestAnimationFrame(frame);
  }
  function frame(now){
    if(travel.ended) return;
    const p = clamp((now - travel.t0)/travel.dur, 0, 1);
    drawMap(nodes, p, ww, wh, false); // 不绘制出发地与运镖车之间的连线
    const pos = posOnPath(nodes, p);
    ectx.font = '32px serif'; ectx.textAlign='center';
    ectx.fillText('🐴', pos.x, pos.y);
    ectx.fillText('📦', pos.x, pos.y-32);
    ectx.fillStyle='#5a3a1a'; ectx.font='15px "KaiTi","STKaiti",serif';
    ectx.fillText('走镖 '+Math.round(p*100)+'%  ·  '+destCity, ww/2, wh-28);
    for(const ev of travel.enc){
      if(!ev.done && !ev.fired && p >= ev.pos){
        ev.fired = true;
        showTravelEvent(ev);
        return; // 暂停动画，等玩家处置
      }
    }
    if(p>=1){ travel.ended = true; startCombat(order, e); return; } // 抵达前必遭劫匪拦截——走镖必须触发战斗，以战果定生死
    travel.raf = requestAnimationFrame(frame);
  }
  travel.raf = requestAnimationFrame(frame);
  }
}

function finishEscort(order, e, outcome){
  document.getElementById('escortLayer').classList.add('hidden');
  e.busy = false;
  order.done = true;
  bgMode = 'hall';
  const s = { outcome, gain:0, repGain:0, expGain:0, lvUp:0, big:false, msg:'' };
  if(outcome === 'win'){
    setSceneBGM('win');
    const big = Math.random() < 0.3;
    let gain = order.reward + (big ? Math.round(order.reward*0.3) : 0);
    if(e.trait && e.trait.reward) gain = Math.round(gain * (1 + e.trait.reward));
    gain = Math.round(gain * (1 + beastAuraVal(e,'reward')));
    if(e.married) gain = Math.round(gain * 1.1); // 夫妻同心：结发镖师报酬 +10%
    gain = Math.round(gain * (1 + talentLv(e,'t_gold')*0.04)); // 行脚天赋：报酬加成
    const phOld = endlessPhase();
    if(phOld > 1) gain = Math.round(gain * (1 + (phOld-1)*0.08)); // 无尽阶段：高风险高报酬
    gain = Math.round(gain * (1 + todayWeather().reward)); // 天气：雨雪天货主肯加价
    if(order._roadReward && order._roadReward > 1) gain = Math.round(gain * order._roadReward); // 山道抄近：报酬 +12%
    gain = Math.round(gain * (1 + buildingBonus('account'))); // 账房：走镖报酬加成
    gain = Math.round(gain * (1 + heritageBonus().reward)); // 传承：走镖报酬加成
    silver += gain; repute += Math.round(order.rep * (1 + heritageBonus().reward)); // 传承：声望加成
    const expMul = ((e.trait && e.trait.exp) ? (1 + e.trait.exp) : 1) * (1 + beastAuraVal(e,'exp'));
    const expGain = Math.round(order.reward/12 * expMul * (1 + buildingBonus('drill'))); // 演武场：经验加成
    e.exp += expGain;
    e.wins++;
    escortCount++;
    if(order.adventure){ advSeen[order.adventure] = 1; advCompleted++; }
    // 无尽模式：升阶公告 + 里程碑奖励（护镖费 +声望）
    const phNew = endlessPhase();
    if(phNew > phOld && phOld > 0){
      const msBonus = phNew*20;
      silver += msBonus; repute += phNew;
      toast('♾️ 无尽难度升至第 '+phNew+' 阶！劫匪更强，报酬 +'+((phNew-1)*8)+'%；里程碑赏 '+msBonus+'两 +'+phNew+'声望');
    }
    // 灵兽获取钩子：无尽模式里程碑 + 途中机缘
    if(seasonMode === 'endless' && escortCount >= 20 && !beasts.b_tiao) grantBeast('b_tiao', '无尽走镖廿趟');
    if(Math.random() < 0.02){
      if(!beasts.b_hu) grantBeast('b_hu', '途中偶逢赤狐幼崽');
      else if(!beasts.b_ma) grantBeast('b_ma', '追风的卢自来');
    }
    const _wF = 1 + todayWeather().fatigue; // 天气：雨雪天赶路更耗体力
    const tiliLoss = Math.max(1, Math.round(((e.trait && e.trait.tili) ? Math.round(rnd(8,16) * (1 - e.trait.tili)) : rnd(8,16)) * (1 - Math.min(0.8, beastAuraVal(e,'til') + talentLv(e,'t_til')*0.05)) * _wF));
    e.tili = clamp(e.tili - tiliLoss, 1, e.maxTili||100);
    s.gain = gain; s.repGain = order.rep; s.expGain = expGain; s.big = big;
    let msg = `✅ ${e.name} 击退劫匪、平安送达！+${gain}两 +${order.rep}声望`;
    if(big) msg += '（沿途还捡了笔外快）';
    if(e.exp >= e.lv*30 && e.lv < realmCap(e)){ e.lv++; e.wuli += rnd(5,10); e.tp = talentPoint(e) + 1; s.lvUp = e.lv; msg += ` · ${e.name}升到 Lv.${e.lv}！得 1 点天赋`; }
    else if(e.exp >= e.lv*30 && canBreakthrough(e)){ msg += ` · ${e.name}已达本境【${realmName(e)}】上限，可突破更进一层`; }
    // 秘籍残页掉落（威胁越高概率越大；门派声望高时偏向该门派残页）
    const dropChance = 0.15 + order.threat*0.05;
    if(Math.random() < dropChance){
      const pg = pickManualPage();
      ownedPages.push(pg.id); msg += ' · 拾得「' + pg.name + '」';
    }
    s.msg = msg; toast(msg);
  } else if(outcome === 'retreat'){
    const loss = Math.round(order.reward*0.15);
    silver = Math.max(0, silver - loss);
    repute = Math.max(0, repute - 1);
    e.tili = clamp(e.tili - rnd(6,12), 1, e.maxTili||100);
    e.losses++;
    s.gain = -loss; s.repGain = -1;
    s.msg = `🏃 ${e.name} 见势不妙，全身而退（镖单未达）`; toast(s.msg);
  } else {
    const loss = Math.round(order.reward*0.3);
    silver = Math.max(0, silver - loss);
    repute = Math.max(0, repute - 2);
    e.tili = clamp(e.tili - rnd(20,35), 1, e.maxTili||100);
    e.wuli = clamp(e.wuli - rnd(0,3), 10, 99);
    e.losses++;
    s.gain = -loss; s.repGain = -2;
    s.msg = `❌ 被劫！${e.name} 失手，损失 ${loss}两，体力大损`; toast(s.msg);
  }
  showSettlement(order, e, outcome, s);
}

// ===== 古朴走镖舆图绘制 =====
function drawMountain(cx, baseY, h, scale){
  ectx.fillStyle='rgba(120,100,70,0.45)';
  ectx.beginPath(); ectx.moveTo(cx-h, baseY); ectx.lineTo(cx, baseY-h); ectx.lineTo(cx+h, baseY); ectx.closePath(); ectx.fill();
}
function posOnPath(nodes, p){
  const segs = nodes.length-1;
  const fp = clamp(p,0,1)*segs;
  let i = Math.floor(fp); if(i>=segs) i=segs-1;
  const lt = fp - i; const a=nodes[i], b=nodes[i+1];
  return { x:a.x+(b.x-a.x)*lt, y:a.y+(b.y-a.y)*lt };
}
function drawMap(nodes, p, ww, wh, showRoute){
  ectx.clearRect(0,0,ww,wh);
  
  // 加载背景图
  const bgImg = new Image();
  bgImg.src = 'img/bg_landscape.jpeg';
  
  // 绘制背景图
  ectx.drawImage(bgImg, 0, 0, ww, wh);
  
  // 半透明遮罩
  ectx.fillStyle='rgba(233,216,176,0.3)';
  ectx.fillRect(0,0,ww,wh);
  
  const scale = ww / 480;
  
  // 双线边框
  ectx.strokeStyle='#7a5a2e'; ectx.lineWidth=6*scale; 
  ectx.strokeRect(12*scale,12*scale,ww-24*scale,wh-24*scale);
  ectx.lineWidth=2*scale; 
  ectx.strokeRect(20*scale,20*scale,ww-40*scale,wh-40*scale);
  
  // 河流
  ectx.strokeStyle='rgba(86,140,172,0.55)'; ectx.lineWidth=9*scale; ectx.setLineDash([]);
  ectx.beginPath(); ectx.moveTo(16*scale,wh*0.75);
  ectx.bezierCurveTo(ww*0.31,wh*0.80,ww*0.42,wh*0.62,ww*0.63,wh*0.68);
  ectx.bezierCurveTo(ww*0.79,wh*0.73,ww*0.87,wh*0.66,ww*0.97,wh*0.71); 
  ectx.stroke();
  
  // 山脉
  drawMountain(ww*0.25, wh*0.35, 64*scale); 
  drawMountain(ww*0.52, wh*0.28, 72*scale); 
  drawMountain(ww*0.77, wh*0.52, 56*scale);
  
  // 标题
  ectx.fillStyle='#5a3a1a'; ectx.font='bold 24px "KaiTi","STKaiti",serif'; 
  ectx.textAlign='center';
  ectx.fillText('走 镖 舆 图', ww/2, 52);
  
  // 全程路线（虚线）
  ectx.strokeStyle='#8a5a2a'; ectx.lineWidth=3*scale; ectx.setLineDash([8,8]);
  ectx.beginPath(); ectx.moveTo(nodes[0].x,nodes[0].y);
  for(let i=1;i<nodes.length;i++) ectx.lineTo(nodes[i].x,nodes[i].y);
  ectx.stroke(); ectx.setLineDash([]);
  
  // 已走过的路线（实线红）——仅当显式要求时绘制（运镖途中不显示出发地与运镖车之间的连线）
  if(showRoute !== false){
    const done = posOnPath(nodes, p);
    ectx.strokeStyle='#c0392b'; ectx.lineWidth=3*scale;
    ectx.beginPath(); ectx.moveTo(nodes[0].x,nodes[0].y); 
    ectx.lineTo(done.x,done.y); 
    ectx.stroke();
  }
  
  // 驿站节点 + 地名标注
  nodes.forEach(n=>{
    ectx.fillStyle='#c0392b'; ectx.beginPath(); 
    ectx.arc(n.x,n.y,7*scale,0,Math.PI*2); 
    ectx.fill();
    ectx.fillStyle='#fff'; ectx.beginPath(); 
    ectx.arc(n.x,n.y,3*scale,0,Math.PI*2); 
    ectx.fill();
    ectx.font='15px "KaiTi","STKaiti",serif'; 
    ectx.textAlign='center';
    const ly = n.y < wh/2 ? n.y-24 : n.y+34;
    const tw = ectx.measureText(n.name).width + 14;
    ectx.fillStyle='rgba(233,216,176,0.92)'; 
    ectx.fillRect(n.x-tw/2, ly-17, tw, 23);
    ectx.strokeStyle='#7a5a2e'; ectx.lineWidth=1.5; 
    ectx.strokeRect(n.x-tw/2, ly-17, tw, 23);
    ectx.fillStyle='#3a2a12'; 
    ectx.fillText(n.name, n.x, ly);
  });
}

let bgmOn = false;
let bgmAudio = null;      // 当前 Audio 实例
let bgmScene = 'home';    // 当前场景
const BGM_MAP = {
  login:    'bgm/home.mp3',    // 登录界面（与主城同曲，沉稳悠扬）
  home:     'bgm/home.mp3',    // 镖局主城

};
function playBGM(scene){
  const f = BGM_MAP[scene] || BGM_MAP.home;
  try{
    if(bgmAudio){ try{ bgmAudio.pause(); }catch(e){} bgmAudio = null; }
    const a = new Audio(f);
    a.loop = true; a.volume = 0.5; a.preload = 'auto';
    a.play().catch(()=>{});   // 浏览器自动播放策略可能拦截；开音乐按钮由用户手势触发
    bgmAudio = a;
  }catch(e){}
}
function setSceneBGM(scene){
  if(!scene || !(scene in BGM_MAP)) scene = 'home';
  if(bgmScene === scene && bgmAudio && !bgmAudio.paused) return;
  bgmScene = scene;
  if(bgmOn) playBGM(scene);
}
function updateBgmBtns(){
  const t = bgmOn ? '🎵 音乐·开' : '🎵 音乐·关';
  const b = document.getElementById('bgmBtn'); if(b) b.textContent = t;
  const ba = document.getElementById('bgmBtnAuth'); if(ba) ba.textContent = t;
}
function toggleBGM(){
  if(bgmOn){
    bgmOn = false;
    if(bgmAudio){ try{ bgmAudio.pause(); }catch(e){} bgmAudio = null; }
    updateBgmBtns();
    return false;
  }
  bgmOn = true;
  playBGM(bgmScene || 'home');
  updateBgmBtns();
  return true;
}

  if(escorts.some(function(e){ return TALENTS.every(function(t){ return talentLv(e,t.id)>=1; }); })) unlockAch('talent_all');
  // 赛季模式成就（仅在对应模式下解锁）
  if(seasonMode==='survival' && day>=30) unlockAch('survival_30');
  if(seasonMode==='speedrun' && repute>=100) unlockAch('speedrun_50');
  if(seasonMode==='endless' && escortCount>=50) unlockAch('endless_50');
  // 宿敌篇
  if(nemesisCleared>=1) unlockAch('nemesis_1');
  if(nemesisCleared>=3) unlockAch('nemesis_3');
  if(dungeonCleared>=1) unlockAch('dungeon_1');
  if(Object.keys(dungeonClearedSet).length >= DUNGEONS.length) unlockAch('boss_all');
  if(tourneyWins>=1) unlockAch('tourney_champ');
  if(tourneyWins>=3) unlockAch('tourney_3');
  // 锻造篇
  if(Object.keys(gearStar).some(function(k){ return (gearStar[k]||0) >= 5; })) unlockAch('forge_master');
  // 境界篇
  if(escorts.some(function(e){ return (e.realm||0) >= 1; })) unlockAch('breakthrough_1');
  if(escorts.some(function(e){ return (e.realm||0) >= 3; })) unlockAch('breakthrough_master');
  if(escorts.some(function(e){ return (e.realm||0) >= 4; })) unlockAch('breakthrough_grand');
  // 建筑篇
  if(Object.keys(bLevels).some(function(k){ return bLevels[k] >= 1; })) unlockAch('build_first');
  if(BUILDINGS.every(function(b){ return (bLevels[b.id]||0) >= b.max; })) unlockAch('build_all');
  // 套装篇
  if(escorts.some(function(e){ return escortActiveSets(e).length >= 1; })) unlockAch('set_first');
  const _allPieces = GEAR_SETS.reduce(function(a,s){ return a.concat(s.pieces); }, []);
  if(_allPieces.every(function(p){ return (gearOwned[p]||0) > 0; })) unlockAch('set_all');
  // 传承篇
  if(heritage >= 1) unlockAch('heritage_1');
  if(heritage >= 3) unlockAch('heritage_3');
  if(heritage >= 2 && escortCount >= 30) unlockAch('ng_prosper');
  // 奇遇篇
  if(advCompleted >= 1) unlockAch('adv_first');
  if(Object.keys(advSeen).length >= 8) unlockAch('adv_master');
  // 奇遇连锁 / 阵营
  if(Object.keys(advFavor).some(k=> advFavor[k] >= CHAIN_THRESHOLD)) unlockAch('adv_chain');
  if(Object.keys(advFavor).some(k=> advFavor[k] >= 6)) unlockAch('adv_loyal');
  if(Object.keys(codexAch).length >= 5) unlockAch('codex_half');
  if(Object.keys(codexAch).length >= CONTRACTS.length) unlockAch('codex_full');
  if(chronicle.length >= 10) unlockAch('chronicle_10');
}

// 修炼秘籍：消耗对应残页提升境界
function studyManual(manualId){
  const m = SECRET_MANUALS.find(x=>x.id===manualId); if(!m) return;
  const stage = secretStages[manualId] || 0;
  if(stage >= 5){ toast(m.name + ' 已臻化境'); return; }
  const need = stage + 1;
  const have = ownedPages.filter(p=>{ const pg = MANUAL_PAGES.find(x=>x.id===p); return pg && pg.manualId===manualId; }).length;
  if(have < need){ toast('残页不足，需 ' + need + ' 张「' + m.name + '」残页（现有 ' + have + '）'); return; }
  let removed = 0;
  for(let i=ownedPages.length-1; i>=0 && removed<need; i--){
    const pg = MANUAL_PAGES.find(x=>x.id===ownedPages[i]);
    if(pg && pg.manualId===manualId){ ownedPages.splice(i,1); removed++; }
  }
  secretStages[manualId] = stage + 1;
  toast('📜 ' + m.name + ' 修炼至第 ' + (stage+1) + ' 重境界！全体镖师武力 +' + (secretStages[manualId]*3));
  renderAll();
  showSecretManuals();
}

// 剿灭宿敌：最强闲镖师对决头领，按威胁定胜负与赏格
function duelNemesis(idx){
  const foe = enemies[idx];
  if(!foe) return;
  const free = escorts.filter(e=>!e.busy);
  if(free.length===0){ toast('无可用镖师，改日再战'); return; }
  const hero = free.slice().sort((a,b)=>b.wuli-a.wuli)[0];
  const foePower = 38 + foe.threat*9 + Math.round((day||1)*0.6);
  const chance = clamp(0.4 + (hero.wuli + manualBonus() - foePower)*0.012, 0.10, 0.92);
  hero.tili = clamp(hero.tili - 25, 1, hero.maxTili||100);
  let _title = '', _body = '';
  if(Math.random() < chance){
    enemies.splice(idx,1);
    const loot = 80 + foe.threat*90;
    const repGain = foe.threat*5;
    silver += loot; repute += repGain;
    hero.wins++;
    nemesisCleared++;
    _title = '⚔️ 剿灭成功';
    _body = hero.name + ' 攻破「' + foe.name + '」！缴获 ' + loot + ' 两，声望 +' + repGain + '。';
    toast('⚔️ ' + hero.name + ' 攻破「' + foe.name + '」！缴获 ' + loot + '两，声望 +' + repGain);
  } else {
    foe.threat++;
    const loss = Math.round(30 + foe.threat*15);
    silver = Math.max(0, silver - loss);
    hero.losses++;
    _title = '💀 围剿失利';
    _body = hero.name + ' 不敌「' + foe.name + '」，对方气焰更盛（威胁 +1），折银 ' + loss + ' 两。休整后再战。';
    toast('💀 围剿失利，「' + foe.name + '」气焰更盛（威胁 +1），折银 ' + loss + '两');
  }
  checkAchievements();
  renderAll();
  // 点「剿灭」时仇家面板已自行关闭，这里补结果弹窗，避免战果被 toast 一闪而过
  showResultModal(_title, _body);
}

  { id:'d_temple', name:'废神庙', emoji:'🏚️', stages:4, threat:4, repute:45,  silver:900,

    boss:{ name:'庙祝·白骨阴师', emoji:'🧟', hpMul:1.8, atkMul:1.55, armor:3 }, bossBonus:{ silver:500, herb:1, gear:1 } },
  { id:'d_fort',   name:'流寇寨', emoji:'🏯', stages:5, threat:5, repute:70,  silver:1500,
    desc:'大股流寇的老巢，五关险隘', drops:['g_shanwen','g_tayun','g_fengchi'], herbs:['h_shen','h_shen'],
    boss:{ name:'寨主·镇山铁臂王', emoji:'🧟', hpMul:1.9, atkMul:1.6, armor:4 }, bossBonus:{ silver:800, herb:2, gear:1 } }
];
const DUNGEON_TIERS = [
  { key:'normal', name:'普通', mult:1.0,  rewMult:1.0, cd:2 },
  { key:'elite',  name:'精英', mult:1.45, rewMult:1.7, cd:3 },
  { key:'hell',   name:'修罗', mult:2.0,  rewMult:2.6, cd:4 }
];
function dungeonById(id){ return DUNGEONS.find(d=>d.id===id); }
function dungeonTier(tIdx){ return DUNGEON_TIERS[tIdx||0] || DUNGEON_TIERS[0]; }
function dungeonKey(did, tIdx){ return did + '#' + (tIdx||0); }
function dungeonAvailable(d, tIdx){ return !dungeonCd[dungeonKey(d.id, tIdx)] || dungeonCd[dungeonKey(d.id, tIdx)] <= (day||1); }
function dungeonPickEscort(){
  const free = escorts.filter(e=> !e.busy && (e.tili||0) >= 30);
  if(free.length === 0) return null;
  return free.slice().sort((a,b)=> (b.wuli+b.lv) - (a.wuli+a.lv))[0];
}
function showDungeons(){
  const modal = document.createElement('div'); modal.className='modal';
  let h = '<div class="box"><div class="box-body"><h3>🗡️ 副本</h3>';
  h += '<p style="font-size:12px;color:#c9b48c;margin:4px 0 10px;">连破数关可取稀罕战利品，通关后需冷却数日方能再探（每周约可两三刷）。出战镖师体力跨关延续，量力而行。每座副本有普通 / 精英 / 修罗三档，难度与报酬递增。</p>';
  DUNGEONS.forEach(d=>{
    DUNGEON_TIERS.forEach(function(t, ti){
      const avail = dungeonAvailable(d, ti);
      const cdLeft = avail ? 0 : (dungeonCd[dungeonKey(d.id, ti)] - (day||1));
      const sil = Math.round(d.silver * t.rewMult), rep = Math.round(d.repute * t.rewMult);
      h += '<div class="storeItem"><div class="info"><b>' + d.emoji + ' ' + d.name + ' · ' + t.name + '</b> <small>' + d.stages + ' 关 · 威胁 ' + Math.round(d.threat*t.mult) + ' · 奖励 ' + sil + '两 / 声望' + rep + (t.mult>1 ? (' · ×'+t.mult+' 难度') : '') + '</small>'
        + '<br><small style="color:#c9b48c;">' + d.desc + '</small>'
        + '<br><small style="color:#9be29b;">战利品：' + d.drops.map(function(id){ return getGear(id).name; }).join('、') + ' · ' + d.herbs.map(function(id){ return getHerb(id).name; }).join('、') + '</small>'
        + (ti===0 ? '<br><small style="color:#ffb3e6;">👑 末关首领：' + d.boss.name + '（斩杀额外赏 ' + d.bossBonus.silver + '两 + 装备 + 药材）</small>' : '')
        + '</div>';
      if(avail) h += '<button onclick="startDungeonRun(\'' + d.id + '\',' + ti + ')"' + (dungeonRun ? ' disabled' : '') + '>出战</button>';
      else h += '<span class="tag">冷却 ' + cdLeft + ' 天</span>';
      h += '</div>';
    });
  });
  if(dungeonRun){ const tt = dungeonTier(dungeonRun.tIdx); h += '<p style="font-size:12px;color:#ffd479;margin:8px 0;">⚔️ 当前挑战：' + dungeonById(dungeonRun.did).name + '（' + tt.name + '）第 ' + (dungeonRun.node+1) + '/' + dungeonRun.total + ' 关</p>'; }
  h += '</div><div class="box-footer"><button class="close">关闭</button></div></div>';
  modal.innerHTML = h;
  modal.querySelector('.close').onclick = ()=> modal.remove();

function startDungeonRun(did, tIdx){
  tIdx = tIdx || 0;
  const d = dungeonById(did); if(!d) return;
  if(dungeonRun){ toast('已有副本进行中'); return; }
  if(!dungeonAvailable(d, tIdx)){ toast(d.name + '（' + dungeonTier(tIdx).name + '）尚在冷却'); return; }
  const e = dungeonPickEscort();
  if(!e){ toast('需一名体力≥30 的空闲镖师出战'); return; }
  dungeonRun = { did:did, tIdx:tIdx, node:0, total:d.stages, eid:e.id };
  toast('🗡️ 进军「' + d.name + '（' + dungeonTier(tIdx).name + '）」！共 ' + d.stages + ' 关');
  dungeonNextFight(did);
}
function dungeonNextFight(did){
  const dr = dungeonRun; if(!dr) return;
  const d = dungeonById(did);
  const t = dungeonTier(dr.tIdx);
  const e = escorts.find(x=> x.id === dr.eid);
  if(!e || (e.tili||0) < 1){ dungeonRun = null; toast('出战镖师力竭，副本中断'); renderAll(); return; }
  const node = dr.node;
  const isBoss = node >= d.stages - 1;
  const order = { id:'dungeon_'+did+'_'+dr.tIdx+'_'+node, need: Math.round((28 + d.threat*7 + node*8) * t.mult), threat: Math.round((d.threat + Math.floor(node/2)) * t.mult), name: d.name + '（' + t.name + '）·第' + (node+1) + (isBoss ? '关 · 首领' : '关') };
  startCombat(order, e, isBoss ? d.boss : null);
}
function completeDungeon(did, e){
  const d = dungeonById(did);
  const dr = dungeonRun;
  const t = dungeonTier(dr ? dr.tIdx : 0);
  dungeonRun = null; dungeonCleared++;
  dungeonCd[dungeonKey(d.id, dr ? dr.tIdx : 0)] = (day||1) + t.cd;
  const gd = pick(d.drops); if(gd) gearOwned[gd] = (gearOwned[gd]||0) + 1;
  const hd = pick(d.herbs); if(hd) herbs[hd] = (herbs[hd]||0) + 1;
  const sil = Math.round(d.silver * t.rewMult), rep = Math.round(d.repute * t.rewMult);
  silver += sil; repute += rep;
  // 首领额外战利品（按档位缩放）
  const bb = d.bossBonus;
  let bsil = 0, bhd = null, bgd = null;
  if(bb){
    bsil = Math.round(bb.silver * t.rewMult); silver += bsil;
    for(let i=0;i<(bb.herb||0);i++){ const h = pick(d.herbs); if(h){ herbs[h] = (herbs[h]||0)+1; bhd = bhd || h; } }
    for(let i=0;i<(bb.gear||0);i++){ const g = pick(d.drops); if(g){ gearOwned[g] = (gearOwned[g]||0)+1; bgd = bgd || g; } }
    dungeonClearedSet[d.id] = true;
  }
  const gname = gd ? getGear(gd).name : '';
  const hname = hd ? getHerb(hd).name : '';
  const bname = (bb && d.boss) ? d.boss.name : '';
  eventLog.unshift({ t:'副本·'+d.name+'('+t.name+')', day:(day||1), outcome:'斩杀首领'+bname+'，连破 '+d.stages+' 关，缴获 '+sil+'两、声望'+rep+(gd?'，得'+gname:'')+(hd?'，得'+hname:'')+(bb?(' · 首领赏 '+bsil+'两'+(bgd?('、'+getGear(bgd).name):'')+(bhd?('、'+getHerb(bhd).name):'')):'') });
  if(eventLog.length > 30) eventLog.length = 30;
  toast('🎉 通关「' + d.name + '（' + t.name + '）」！+' + sil + '两 · 声望+' + rep + (gd?(' · 获'+gname):'') + (hd?(' · 得'+hname):'') + (bb?(' · 斩'+bname+'赏'+bsil+'两'):''));
  unlockAch('dungeon_1');
  checkAchievements();
  renderAll();
}
