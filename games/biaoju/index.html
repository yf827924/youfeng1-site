  h += '<p style="font-size:13px;color:#ffd479;margin:12px 0 4px;">🐾 灵兽阁（声望兑换）</p>';
  h += '<p style="font-size:12px;color:#c9b48c;margin:4px 0 8px;">声望最高的门派够格，再添银两，便可请灵兽下山。</p>';
  SECT_BEASTS.forEach(x=>{
    const B = BEASTS.find(b=> b.id === x.id);
    if(!B) return;
    const owned = !!beasts[B.id];
    const best = bestSectRep();
    const repOk = best >= x.rep;
    const canBuy = owned || !repOk || silver < x.cost;
    let hint = owned ? '已请回镖局' : (repOk ? '声望已够' : '最高门派声望 ' + best + '/' + x.rep);
    h += `<div class="storeItem"><div class="info"><b style="color:#ffd479">${B.emoji} ${B.name}</b>`
      + `<small>✨ ${B.aura.name}（幼年期 ${B.aura.fmt(B.aura.vals[0])} 起）</small>`
      + `<small>所需：任一门派声望 ${x.rep} + ${x.cost}两 · ${hint}</small></div>`
      + `<button onclick="exchangeSectBeast('${B.id}')" style="font-size:12px;"${canBuy ? ' disabled' : ''}>${owned ? '已拥有' : '兑换'}</button></div>`;
  });
  h += '</div><div class="box-footer"><button class="close">关闭</button></div></div>';
  modal.innerHTML = h;
  modal.querySelector('.close').onclick = ()=> modal.remove();
  document.getElementById('wrap').appendChild(modal);
}

// 灵兽阁兑换条件：b_yuan 任一门派声望50+300两；b_xiong 120+800两
const SECT_BEASTS = [
  { id:'b_yuan',  rep:50,  cost:300 },
  { id:'b_xiong', rep:120, cost:800 }
];
function bestSectRep(){
  let best = 0;
  SECTS.forEach(s=>{ const r = (sectRep && sectRep[s.id]) || 0; if(r > best) best = r; });
  return best;
}
function exchangeSectBeast(id){
  const x = SECT_BEASTS.find(v=> v.id === id);
  if(!x) return;
  if(beasts[id]){ toast('这只灵兽已在镖局了'); return; }
  const best = bestSectRep();
  if(best < x.rep){ toast('声望不够，需任一门派达 ' + x.rep + '（当前最高 ' + best + '）'); return; }
  if(silver < x.cost){ toast('银两不足，需 ' + x.cost + '两'); return; }
  silver -= x.cost;
  grantBeast(id, '灵兽阁兑换');
  renderAll(); showSects();
}

// 接取门派任务
function acceptSectMission(mid){
  const m = sectMissions.find(x=> x.id === mid);
  if(!m) return;
  if(m.type === 'gift'){
    if(silver < m.cost){ toast('银两不足，需 '+m.cost+'两'); return; }
    silver -= m.cost; sectRep[m.sectId] = (sectRep[m.sectId] || 0) + m.rep;
    sectMissions = sectMissions.filter(x=> x.id !== mid);
    toast('🏯 向'+sectName(m.sectId)+'捐献，门派声望 +'+m.rep);
    renderAll(); showSects(); return;
  }
  const avail = escorts.filter(e=> !e.busy && e.tili >= 20);
  if(avail.length === 0){ toast('没有可派遣的镖师，先休整或招募'); return; }
  const modal = document.createElement('div'); modal.className = 'modal';
  let hh = `<div class="box"><h3>派遣哪位镖师执行「${m.desc}」？</h3>`;
  avail.forEach(e=>{
    hh += `<div class="opt" data-id="${e.id}"><div style="display:flex;align-items:center;gap:12px;">
      <img src="${e.portrait}" style="width:48px;height:48px;border-radius:50%;object-fit:cover;border:2px solid #6b4f2a;">
      <div>🐎 ${e.name} <small>Lv.${e.lv}</small><br><small>武力 ${e.wuli} · 兵路 ${schoolName(e.school)}</small></div></div></div>`;
  });
  hh += `<div class="box-footer"><button class="close">取消</button></div></div>`;
  modal.innerHTML = hh;
  modal.querySelector('.close').onclick = ()=> modal.remove();
  modal.querySelectorAll('.opt').forEach(op=> op.onclick = ()=>{ modal.remove(); resolveSectMission(m, avail.find(e=> e.id === op.dataset.id)); });
  document.getElementById('wrap').appendChild(modal);
}

// 结算门派任务（护送/除害）
function resolveSectMission(m, e){
  const need = m.threat * 14;
  const chance = clamp(0.45 + (e.wuli + manualBonus() - need) * 0.02, 0.15, 0.95);
  if(Math.random() < chance){
    sectRep[m.sectId] = (sectRep[m.sectId] || 0) + m.rep;
    silver += m.reward;
    let extra = '';
    if(sectLevel(m.sectId) >= 1 && Math.random() < 0.25){ const pg = pickManualPage(); ownedPages.push(pg.id); extra = ' · 获「'+pg.name+'」'; }
    toast('🏯 完成'+sectName(m.sectId)+'任务：门派声望 +'+m.rep+' · 报酬 +'+m.reward+'两'+extra);
  } else {
    e.tili = clamp(e.tili - rnd(8,16), 1, e.maxTili||100);
    toast('⚠️ '+e.name+' 任务受挫，略损体力');
  }
  sectMissions = sectMissions.filter(x=> x.id !== m.id);
  renderAll();
  // 派遣选择框已关闭，但门派声望面板仍在显示旧数据 → 重开刷新
  refreshModalIfOpen('门派声望', function(){ showSects(); });
}

// 结为伉俪
function marryEscorts(aId, bId){
  const a = escorts.find(x=> x.id === aId), b = escorts.find(x=> x.id === bId);
  if(!a || !b || a.married || b.married) return;
  if(silver < MARRY_COST){ toast('银两不足'); return; }
  silver -= MARRY_COST;
  a.married = true; a.spouse = b.id;
  b.married = true; b.spouse = a.id;
  toast('💞 ' + a.name + ' 与 ' + b.name + ' 喜结连理！此后走镖报酬 +10%、相互照应防御 +2');
  renderAll(); showDisciples();
}

// 退休（可传艺于弟子 discipleId）
function retireEscort(escortId, discipleId){
  const e = escorts.find(x=> x.id === escortId); if(!e) return;
  if(e.busy){ toast('该镖师正在走镖，不可退休'); return; }
  if(e.lv < RETIRE_MIN_LV){ toast('需 Lv.' + RETIRE_MIN_LV + ' 以上方可退休'); return; }
  const sevSilver = e.lv * 40 + e.wins * 8;
  const sevRepute = Math.min(e.lv, 10);
  let msg = '🚪 ' + e.name + ' 功成身退';
  if(discipleId){
    const d = escorts.find(x=> x.id === discipleId);
    if(d){
      const transfer = Math.min(15, Math.floor((e.wuli - d.wuli) * 0.35));
      d.wuli = clamp(d.wuli + transfer, 20, 95);
      d.trait = e.trait || d.trait;
      d.inheritedFrom = e.name;
      msg += '，传艺于 ' + d.name + '（武力 +' + transfer + '，承其特质）';
    }
  }
  silver += sevSilver; repute = clamp(repute + sevRepute, 0, 9999);
  if(e.spouse){ const sp = escorts.find(x=> x.id === e.spouse); if(sp){ sp.married = false; sp.spouse = null; } }
  escorts = escorts.filter(x=> x.id !== escortId);
  msg += '。获退隐厚赏 +' + sevSilver + '两 +' + sevRepute + '声望';
  toast(msg);
  renderAll(); showDisciples();
}

// 参加武林大会
function enterMartialContest(escortId){
  setSceneBGM('contest');
  const e = escorts.find(x=>x.id===escortId);
  if(!e) return;
  const opponentWuli = clamp(20 + rnd(0, biaojuLv*8), 20, 90);
  const winChance = e.wuli / (e.wuli + opponentWuli);
  const won = Math.random() < winChance;
  if(won){
    const reward = rnd(1, 3);
    for(let i=0;i<reward;i++) ownedPages.push(pickManualPage().id);
    repute += rnd(3, 8);
    martialContestResults.push(`${e.name}击败了对手（武力${opponentWuli}），获得${reward}张秘籍残页`);
    toast('🏟️ 武林大会胜利！获得秘籍残页');
  } else {
    martialContestResults.push(`${e.name}不敌对手（武力${opponentWuli}）`);
    toast('🏟️ 武林大会落败...');
  }
  renderAll();
  // 出战是在「武林大会」面板里点的，不重开会显示旧名单与旧战绩
  refreshModalIfOpen('武林大会', function(){ showMartialContest(); });
}

  const cost = Math.max(0, Math.round(hurt.length*35 * (1 - buildingBonus('clinic')))); // 医馆：休整费折扣
  if(silver < cost){ toast('全员休整需 '+cost+'两'); return; }
  silver -= cost;
  escorts.forEach(e=> e.tili = e.maxTili||100);
  toast('💊 全员体力恢复');
  renderAll();
};
document.getElementById('nextBtn').onclick = ()=>{
  day++;
  escorts.forEach(e=> e.tili = clamp(e.tili + 30, 0, e.maxTili||100));
  orders = orders.filter(o=>!o.done).concat([makeOrder()]);
  if(day % ADV_INTERVAL === 0) spawnAdventureOrders(); // 随机镖路：周期刷新奇遇镖
  // 分舵每日进账（受门派声望「至交」全局加成）
  let branchInc = 0;
  const incMul = 1 + totalSectIncomePct();
  Object.values(branches).forEach(b=>{ if(b && b.active){ const inc = Math.round(b.income * incMul); silver += inc; branchInc += inc; } });
  // 刷新门派任务
  genSectMissions();
  const wToday = todayWeather();
  if(branchInc > 0) toast('🌙 第 '+day+' 天 · '+wToday.emoji+wToday.name+'，体力恢复些许，分舵进账 +'+branchInc+'两');
  else toast('🌙 第 '+day+' 天 · '+wToday.emoji+wToday.name+'，镖师体力恢复些许');
  // 宿敌滋扰：有仇家时夜里可能来犯
  if(enemies.length > 0 && Math.random() < 0.35){
    const foe = enemies[rnd(0, enemies.length-1)];
    const loss = Math.min(silver, Math.round(20 + foe.threat*12));
    silver -= loss;

  }
  renderAll();
  if(bgMode === 'hall' && Math.random() < 0.7) triggerEvent();
};

function drawHP(x, y, w, hp, max, color, label){
  cctx.fillStyle = 'rgba(0,0,0,.5)'; cctx.fillRect(x-2, y-2, w+4, 18);
  cctx.fillStyle = '#3a2c18'; cctx.fillRect(x, y, w, 14);
  cctx.fillStyle = color; cctx.fillRect(x, y, w*clamp(hp/max,0,1), 14);
  cctx.fillStyle = '#fff'; cctx.font = '12px sans-serif'; cctx.textAlign = 'center';
  cctx.fillText(label + '  ' + Math.max(0,Math.round(hp)) + '/' + max, x+w/2, y+11);
}
function drawMP(x, y, w, mp, max, label){
  cctx.fillStyle = 'rgba(0,0,0,.5)'; cctx.fillRect(x-2, y-2, w+4, 18);
  cctx.fillStyle = '#23304a'; cctx.fillRect(x, y, w, 14);
  cctx.fillStyle = '#5aa8ff'; cctx.fillRect(x, y, w*clamp(mp/max,0,1), 14);
  cctx.fillStyle = '#fff'; cctx.font = '12px sans-serif'; cctx.textAlign = 'center';
  cctx.fillText(label + ' ' + Math.max(0,Math.round(mp)) + '/' + max, x+w/2, y+11);
}
function statusText(o){
  const s = [];
  if(o.poison>0) s.push('🤢'+o.poison);
  if(o.atkBuff>0) s.push('💪'+o.atkBuff);
  if(o.stun>0) s.push('💫'+o.stun);
  if(o.defDown>0) s.push('🛡️'+o.defDown);
  if(o.defUp>0) s.push('🛡️'+o.defUp);
  if(o.enraged) s.push('🔥');
  return s.join(' ');
}

// ===== 3D 人物 / 道具（Three.js，缺失时自动降级到 2D）=====
const B3D = (function(){
  let renderer, scene, camera, clock, ready = false;
  let charL = null, charR = null, single = null, singleMode = 'char';
  let target = null;
  function init(){
    if(typeof THREE === 'undefined') return false;
    try {
      renderer = new THREE.WebGLRenderer({ antialias:true, alpha:true });
      renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
      scene = new THREE.Scene();
      scene.background = new THREE.Color(0x140e07);
      camera = new THREE.PerspectiveCamera(45, 1, 0.1, 100);
      camera.position.set(0, 1.2, 5.2);
      camera.lookAt(0, 1.0, 0);
      scene.add(new THREE.HemisphereLight(0xfff3dd, 0x3a2c1c, 0.6));
      const d1 = new THREE.DirectionalLight(0xffe2b0, 0.95); d1.position.set(3,6,4); scene.add(d1);
      const d2 = new THREE.DirectionalLight(0x88aaff, 0.35); d2.position.set(-4,3,-3); scene.add(d2);
      const d3 = new THREE.DirectionalLight(0xff8855, 0.28); d3.position.set(-2,2,-4); scene.add(d3);
      // 场景氛围：两盏红灯笼（异步加载，失败静默）
      loadGLB('lantern.glb', function(m){
        if(!m) return;
        [-2.9, 2.9].forEach(x=>{
          const l = m.clone(true);
          l.scale.setScalar(0.55);
          l.position.set(x, 1.35, -2.3);
          scene.add(l);
        });
      });
      clock = new THREE.Clock();
      ready = true; return true;
    } catch(e){ console.warn('B3D init fail', e); return false; }
  }
  function ensure(){ if(!ready) init(); return ready; }
  // ===== GLB 道具模型：加载/缓存/替换 =====
  let _gltfLoader = null;
  const _glbCache = {};
  const GLB_MAP = { weapon:'sword.glb', gear:'chest.glb', herb:'jar.glb' };
  function loadGLB(name, cb){
    if(_glbCache[name]){ cb(_glbCache[name].clone(true)); return; }
    if(typeof THREE.GLTFLoader === 'undefined'){ try{ toast('⚠️ GLTFLoader 未加载，3D 道具回退'); }catch(e){} cb(null); return; }
    if(!_gltfLoader) _gltfLoader = new THREE.GLTFLoader();
    _gltfLoader.load('models/' + name, function(gltf){
      const src = gltf.scene;
      // 归一化：缩放到统一尺寸 + 居中到原点（转台动画按轴心处理）
      let box = new THREE.Box3().setFromObject(src);
      const size = box.getSize(new THREE.Vector3());
      const s = 2.2 / Math.max(size.x, size.y, size.z, 0.001);
      src.scale.setScalar(s);
      box.setFromObject(src);
      src.position.sub(box.getCenter(new THREE.Vector3()));
      _glbCache[name] = src;
      cb(src.clone(true));
    }, undefined, function(err){
      try{ toast('⚠️ 3D 模型加载失败: ' + name + (err && err.message ? ' · ' + err.message : '')); }catch(e){}
      cb(null);
    });
  }
  function setPropGLB(cfg){
    const g = buildProp(cfg);
    setProp(g);
    const name = GLB_MAP[cfg && cfg.kind];
    if(!name) return g;
    loadGLB(name, function(m){
      // 转台上仍是这次请求的道具时才替换，避免快速切换时覆盖后来的
      if(m && single === g){ clearAll(); single = m; singleMode = 'prop'; scene.add(m); }
    });
    return g;
  }
  function mat(c, sh){ return new THREE.MeshPhongMaterial({ color:c, shininess: (sh || 24), specular: 0x282828 }); }
  function box(w,h,d,c){ return new THREE.Mesh(new THREE.BoxGeometry(w,h,d), mat(c)); }
  function cyl(rt,rb,h,c,s){ return new THREE.Mesh(new THREE.CylinderGeometry(rt,rb,h,s||10), mat(c)); }

  function buildCharacter(cfg){

  function clearAll(){

        if(p.head) p.head.rotation.y = look;

function drawPortrait(img, x, y, w, h){
  cctx.save();
  if(img && img.complete && img.naturalWidth){
    cctx.drawImage(img, x, y, w, h);
  } else {
    cctx.fillStyle = 'rgba(0,0,0,.35)';
    cctx.fillRect(x, y, w, h);
  }
  cctx.strokeStyle = '#6b4f2a'; cctx.lineWidth = 2;
  cctx.strokeRect(x-1, y-1, w+2, h+2);
  cctx.restore();
}
function drawCombat(){
  cctx.clearRect(0,0,CWW,CWH);
  const use3D = B3D.isReady();
  if(!use3D){
    const bgImg = new Image(); bgImg.src = 'img/bg_battle.jpeg';
    cctx.drawImage(bgImg, 0, 0, CWW, CWH);
    cctx.fillStyle = 'rgba(42,32,20,0.5)'; cctx.fillRect(0,0,CWW,CWH);
  }
  cctx.save();
  if(combat && combat.shake > 0){
    const s = combat.shake;
    cctx.translate((Math.random()*2-1)*s/2, (Math.random()*2-1)*s/2);
  }
  const p = combat.player, en = combat.enemy;
  cctx.fillStyle = '#ffd479'; cctx.font = 'bold 24px serif'; cctx.textAlign = 'center';
  cctx.fillText('⚔️ 走 镖 遇 劫 ⚔️', CWW/2, 32);
  // 左右上角半身像：镖师真实头像 / 劫匪图，始终绘制（3D 只负责中央对战演出）
  const pw = 88, ph = 116, ppy = 52;
  drawPortrait(combat.pImg, 16, ppy, pw, ph);
  drawPortrait(combat.eImg, CWW - 16 - pw, ppy, pw, ph);
  const hpY = ppy + ph + 12;
  const hpw = Math.min(240, Math.max(150, Math.min(CWW, CWH) * 0.3));
  drawHP(16, hpY, hpw, p.hp, p.max, '#5fd36a', p.name + ' · ' + schoolName(p.school) + ' · ' + (p.weapon ? p.weapon.name : '徒手'));
  drawMP(16, hpY+18, hpw, p.mp, p.maxMp, '内力');
  cctx.fillStyle='#ffd0a0'; cctx.font='12px sans-serif'; cctx.textAlign='left';
  cctx.fillText(statusText(p), 16, hpY+48);
  drawHP(CWW - 16 - hpw, hpY, hpw, en.hp, en.max, '#e0533b', en.name + ' · ' + schoolName(en.school) + ' · 攻' + en.atk);
  cctx.fillStyle='#ffb0b0'; cctx.font='12px sans-serif'; cctx.textAlign='right';
  cctx.fillText(statusText(en), CWW-16, hpY+48);
  combat.dmg.forEach(d=>{
    cctx.globalAlpha = clamp(d.life,0,1);
    cctx.fillStyle = d.color; cctx.font = 'bold 32px sans-serif'; cctx.textAlign = 'center';
    cctx.fillText(d.text, d.x, d.y); cctx.globalAlpha = 1;
  });

    const a = clamp(combat.bossIntro / 1.8, 0, 1);
    cctx.save();
    cctx.fillStyle = 'rgba(28,0,0,' + (0.5 * a) + ')';
    cctx.fillRect(0, 0, CWW, CWH);
    cctx.fillStyle = '#ff5b5b';
    cctx.font = 'bold ' + Math.round(34 * (1.15 + (1-a)*0.4)) + 'px serif';
    cctx.textAlign = 'center';
    cctx.fillText('⚠️ 头 目 现 身 ⚠️', CWW/2, CWH*0.5);
    cctx.restore();
  }
  cctx.restore();
}


function combatFrame(){
  if(!combat) return;
  const dt = 1/60;
  combat.tick = (combat.tick || 0) + dt;
  if(combat.lunge) combat.lunge *= 0.82;
  combat.dmg.forEach(d=>{ d.y -= 0.6; d.life -= dt*1.4; });
  combat.dmg = combat.dmg.filter(d=> d.life>0);
  combat.fx.forEach(f=>{ f.t += dt; });
  combat.fx = combat.fx.filter(f=> f.t < f.life);
  if(combat.shake > 0) combat.shake = Math.max(0, combat.shake - dt*40);
  if(combat.enemyLunge) combat.enemyLunge *= 0.82;
  if(combat.bossIntro > 0) combat.bossIntro -= dt;
  drawCombat();
  if(B3D.isReady()){ B3D.render(dt, { lunge: combat.lunge||0, enemyLunge: combat.enemyLunge||0 }); }
  combatAnim = requestAnimationFrame(combatFrame);
}

  }
  logCombat('💢 半路杀出' + enemy.name + '！（使' + schoolName(enSchool) + '）' + (rel>0 ? ' ' + schoolName(eSchool) + '克' + schoolName(enSchool) + '，占优！' : rel<0 ? ' 小心，' + schoolName(enSchool) + '被克！' : ''));
  const _bb = beastOf(e);

  if(combatAnim) cancelAnimationFrame(combatAnim);

}
function playerTurnStart(){
  const p = combat.player;
  if(p.poison>0){ const d=rnd(3,7); p.hp=clamp(p.hp-d,0,p.max); p.poison--; logCombat('🤢 '+p.name+' 毒发，气血 -'+d); pushDmg(CWW*0.20, CWH*0.32, '毒 -'+d, '#9be29b'); }
  p.mp = clamp(p.mp + 5, 0, p.maxMp);
  if(p.atkBuff>0) p.atkBuff--;
  if(p.defDown>0) p.defDown--;
}
function doAttack(){
  const p = combat.player, en = combat.enemy;
  playerTurnStart();
  if(p.hp <= 0){ endCombat('lose'); return; }
  let base = p.atk + (p.atkBuff>0?6:0) + rnd(-3,4);
  const crit = Math.random() < 0.15;
  let dmg = Math.max(1, Math.round((base - rnd(0,2) - (en.armor||0)) * 0.82));
  if(crit) dmg = Math.round(dmg * 1.5);
  if(en.defDown>0) dmg = Math.round(dmg * 1.25);
  if(en.defUp>0) dmg = Math.max(1, Math.round(dmg * 0.8));
  en.hp = clamp(en.hp - dmg, 0, en.max);
  pushDmg(CWW*0.80, CWH*0.32, '-' + dmg + (crit ? ' 暴击!' : ''), '#ffce54');
  spawnHitFx('enemy', crit);
  playSfx(crit ? 'crit' : 'attack');
  combat.lunge = 1;
  logCombat((crit ? '暴击！' : '') + p.name + ' 挥兵直取，对' + en.name + ' 造成 ' + dmg + ' 伤害');
  if(en.hp <= 0){ endCombat('win'); return; }
  enemyTurn();
}
function doSkill(){
  const p = combat.player, en = combat.enemy;
  if(p.mp < 8){ toast('内力不足，无法施展绝技'); return; }
  playerTurnStart();
  if(p.hp <= 0){ endCombat('lose'); return; }
  p.mp -= 8;
  let base = Math.round((p.atk + (p.atkBuff>0?6:0) + rnd(-2,5)) * 1.6);
  p.hp = clamp(p.hp - 6, 1, p.max);
  let dmg = Math.max(1, Math.round((base - (en.armor||0)) * 0.82));
  if(en.defDown>0) dmg = Math.round(dmg * 1.25);
  if(en.defUp>0) dmg = Math.max(1, Math.round(dmg * 0.8));
  en.hp = clamp(en.hp - dmg, 0, en.max);
  pushDmg(CWW*0.80, CWH*0.32, '绝技 -' + dmg, '#ffce54');
  spawnHitFx('enemy', true);
  playSfx('crit');
  combat.lunge = 1;
  logCombat('💥 ' + p.name + ' 使出「' + (p.weapon ? p.weapon.skill : '重击') + '」，造成 ' + dmg + ' 重创！（内力 -8）');
  if(en.hp <= 0){ endCombat('win'); return; }
  enemyTurn();
}
function doDart(){
  const p = combat.player, en = combat.enemy;
  if(p.mp < 5){ toast('内力不足，无法掷暗器'); return; }
  playerTurnStart();
  if(p.hp <= 0){ endCombat('lose'); return; }
  p.mp -= 5;
  let base = Math.round(p.atk * 0.9 + rnd(0,4) + (p.atkBuff>0?4:0));
  let dmg = Math.max(1, Math.round((base - (en.armor||0)) * 0.82));
  if(en.defDown>0) dmg = Math.round(dmg * 1.25);
  if(en.defUp>0) dmg = Math.max(1, Math.round(dmg * 0.8));
  en.hp = clamp(en.hp - dmg, 0, en.max);
  const stun = Math.random() < 0.35;
  if(stun) en.stun = Math.max(en.stun, 1);
  pushDmg(CWW*0.80, CWH*0.32, '暗器 -' + dmg + (stun ? ' 眩晕!' : ''), '#c8f0ff');
  spawnHitFx('enemy', false);
  playSfx('attack');
  combat.lunge = 1;
  logCombat('✨ ' + p.name + ' 扬手掷出暗器，造成 ' + dmg + ' 伤害' + (stun ? '，敌人陷入眩晕！' : ''));
  if(en.hp <= 0){ endCombat('win'); return; }
  enemyTurn();
}
function doDefend(){
  const p = combat.player;
  playerTurnStart();
  if(p.hp <= 0){ endCombat('lose'); return; }
  p.defending = true;
  p.atkBuff = Math.max(p.atkBuff, 2);
  logCombat('🛡️ ' + p.name + ' 凝神防御，蓄势待发（攻 +2）');
  enemyTurn();
}
// 灵兽主动技：每场战斗一次，效果随灵兽阶段增强
function doBeastAct(){
  const p = combat.player, en = combat.enemy;
  const bid = combat.beastId;
  const act = bid ? BEAST_ACTS[bid] : null;
  if(!act){ toast('没有可出手的灵兽'); return; }
  if(combat.beastUsed){ toast('灵兽本战已出过手'); return; }
  combat.beastUsed = true;
  const bBtn = document.getElementById('beastBtn');
  if(bBtn) bBtn.style.display = 'none';
  playerTurnStart();
  if(p.hp <= 0){ endCombat('lose'); return; }
  const meta = BEASTS.find(b=>b.id===bid) || { emoji:'🐾', name:'灵兽' };
  const m = 1 + ((combat.beastStage||1) - 1) * 0.2; // 幼年期 ×1.0，成年期 ×1.2，灵兽期 ×1.4
  const tag = meta.emoji + ' ' + meta.name + '施展「' + act.label + '」';
  const heal = (v)=>{ const amt = Math.round(v*m); p.hp = clamp(p.hp + amt, 1, p.max); pushDmg(CWW*0.20, CWH*0.32, '+' + amt, '#5fd36a'); spawnHealFx(); return amt; };
  let sfx = 'crit';
  if(bid === 'b_huang'){ en.stun = Math.max(en.stun||0, 1); logCombat(tag + '，' + en.name + ' 吓得心神一乱！'); }
  else if(bid === 'b_sun'){ p.atkBuff = Math.max(p.atkBuff||0, 2); logCombat(tag + '，' + p.name + ' 气势如虹！'); }
  else if(bid === 'b_yuan'){ const a = heal(25); logCombat(tag + '，' + p.name + ' 气血 + ' + a); sfx = 'heal'; }
  else if(bid === 'b_xiong'){ p.defending = true; logCombat(tag + '，铁背挡在身前！'); }
  else if(bid === 'b_tiao'){ en.defDown = Math.max(en.defDown||0, Math.round(2*m)); logCombat(tag + '，' + en.name + ' 护甲松动！'); }
  else if(bid === 'b_hu'){ en.stun = Math.max(en.stun||0, 1); en.defDown = Math.max(en.defDown||0, 1); logCombat(tag + '，' + en.name + ' 眼花缭乱！'); }
  else if(bid === 'b_ma'){ p.defending = true; const a = heal(12); logCombat(tag + '，' + p.name + ' 缓过一口气（气血 +' + a + '）'); sfx = 'heal'; }
  else if(bid === 'b_he'){ const a = heal(40); logCombat(tag + '，' + p.name + ' 气血 + ' + a); sfx = 'heal'; }
  else if(bid === 'b_shuang'){ const amt = Math.round(30*m); p.mp = clamp(p.mp + amt, 0, p.maxMp); logCombat(tag + '，' + p.name + ' 内力 + ' + amt); sfx = 'heal'; }
  else { logCombat(tag + '！'); }
  playSfx(sfx);
  enemyTurn();
}
function useHerbInCombat(){
  const p = combat.player;
  const id = Object.keys(herbs).find(k=> herbs[k] > 0);
  if(!id){ toast('药材库空空如也'); return; }
  const h = getHerb(id); herbs[id]--;
  const healed = Math.round(h.heal * (1 + beastAuraVal(p.e,'herb')));
  p.hp = clamp(p.hp + healed, 1, p.max);
  logCombat('💊 服下' + h.name + '，恢复 ' + healed + ' 气血');
  const scale = CWW / 480;
  pushDmg(CWW*0.20, CWH*0.32, '+' + h.heal, '#5fd36a');
  spawnHealFx();
  playSfx('heal');
  enemyTurn();
}
function tryFlee(){
  const p = combat.player;
  let chance = clamp(0.35 + p.hp/220, 0.3, 0.8);
  if(p.e && p.e.trait && p.e.trait.flee) chance = clamp(chance + p.e.trait.flee, 0.3, 0.9);
  const psF = SCHOOL_BY_ID[p.school]; if(psF && psF.flee) chance = clamp(chance + psF.flee, 0.3, 0.9);
  chance = clamp(chance + beastAuraVal(p.e,'flee'), 0.3, 0.95);
  if(Math.random() < chance){ logCombat('🏃 ' + p.name + ' 施展轻功，全身而退'); playSfx('flee'); endCombat('retreat'); }
  else { 
    logCombat('⚠️ 撤退失败，被绊了一跤！'); playSfx('hit'); 
    p.hp = clamp(p.hp - rnd(6,12), 1, p.max); 
    const scale = CWW / 480;
    pushDmg(CWW*0.20, CWH*0.32,'','#e0533b');
    combat.lunge = -0.5; 
    enemyTurn(); 
  }
}
function enemyTurn(){
  const p = combat.player, en = combat.enemy;
  if(en.hp <= 0){ endCombat('win'); return; }
  combat.busy = true; setCombatButtons(false);
  setTimeout(()=>{
    if(!combat || combat.over) return;
    if(en.stun > 0){
      en.stun--; if(en.defDown>0) en.defDown--; if(en.defUp>0) en.defUp--;
      logCombat('💫 ' + en.name + ' 被眩晕，无法行动！');
      if(en.hp <= 0){ endCombat('win'); return; }
      combat.busy = false; setCombatButtons(true); return;
    }
    if(en.defDown>0) en.defDown--;
    if(en.defUp>0) en.defUp--;
    if(en.healCd>0) en.healCd--;
    // 狂暴：血量低于三成，攻势暴涨
    if(!en.enraged && en.hp <= en.max*0.3){
      en.enraged = true; en.atk = Math.round(en.atk*1.3);
      logCombat('🔥 ' + en.name + ' 双目赤红，陷入狂暴！（攻 +30%）');
    }
    // 疗伤：残血时吞药回血（有冷却）
    if(en.hp < en.max*0.45 && en.healCd <= 0 && Math.random() < 0.2){
      const heal = Math.round(en.max*0.22);
      en.hp = clamp(en.hp + heal, 0, en.max); en.healCd = 3;
      logCombat('🧪 ' + en.name + ' 吞服伤药，恢复 ' + heal + ' 气血！');
      combat.busy = false; setCombatButtons(true); return;
    }
    const defNow = Math.max(0, p.def - (p.defDown>0 ? Math.round(p.def*0.5) : 0));
    const roll = Math.random();
    let dmg, act;
    if(roll < 0.22){ act='重击'; dmg = Math.max(1, Math.round((Math.round(en.atk*1.45 + rnd(-2,5)) - defNow - (p.defending?Math.round(defNow*0.5):0)) * 0.82)); }
    else if(roll < 0.44){ act='投石'; dmg = Math.max(1, Math.round((en.atk + rnd(-3,4) - defNow - (p.defending?Math.round(defNow*0.5):0)) * 0.82)); if(Math.random()<0.42){ p.poison = Math.max(p.poison, 2); logCombat('☠️ '+en.name+' 投石带毒，你身中剧毒！'); } }
    else if(roll < 0.58){ en.defUp = (en.defUp||0) + 2; logCombat('👹 '+en.name+' 凝神蓄力（防御增强）'); combat.busy=false; setCombatButtons(true); return; }
    else if(roll < 0.74){ act='破防'; dmg = Math.max(1, Math.round((Math.round(en.atk*0.7 + rnd(-2,3)) - defNow - (p.defending?Math.round(defNow*0.5):0)) * 0.82)); p.defDown = Math.max(p.defDown, 2); logCombat('💢 '+en.name+' 施放破防一击，你防御下降！'); }
    else { act='攻击'; dmg = Math.max(1, Math.round((en.atk + rnd(-3,4) - defNow - (p.defending?Math.round(defNow*0.5):0)) * 0.82)); }
    if(p.defending){ logCombat('🛡️ 挡下大半攻势'); p.defending = false; }
    else logCombat('👹 ' + en.name + ' ' + act + '而来');
    p.hp = clamp(p.hp - dmg, 0, p.max);
    pushDmg(CWW*0.20, CWH*0.32, (dmg>0?'-'+dmg:''), '#e0533b');
    spawnHitFx('player', false);
    playSfx('hit');
    combat.lunge = -0.5; combat.enemyLunge = 1;
    // 重击有概率连招追击
    if(act === '重击' && Math.random() < 0.35 && p.hp > 0){
      const dmg2 = Math.max(1, Math.round(dmg*0.55));
      p.hp = clamp(p.hp - dmg2, 0, p.max);
      pushDmg(CWW*0.20, CWH*0.40, '-' + dmg2, '#e0533b');
      logCombat('⚡ ' + en.name + ' 连招追击，再中 ' + dmg2 + ' 伤害！');
    }
    if(p.hp <= 0){ endCombat('lose'); return; }
    combat.busy = false; setCombatButtons(true);
  }, 650);
}
function endCombat(result){
  if(!combat || combat.over) return;
  combat.over = true;
  if(result === 'win') playSfx('win'); else if(result === 'lose') playSfx('lose'); else if(result === 'retreat') playSfx('flee');
  if(combatAnim) cancelAnimationFrame(combatAnim);
  const p = combat.player, e = combat.e, order = combat.order;
  e.tili = clamp(Math.round(p.hp), 1, e.maxTili||100);   // 气血化为体力
  if(dungeonRun){
    const dr = dungeonRun;
    document.getElementById('combatLayer').classList.add('hidden');
    combat = null;
    if(result === 'win'){
      dr.node++;
      if(dr.node >= dr.total){ completeDungeon(dr.did, e); }
      else { toast('⚔️ 第 ' + dr.node + ' 关已过，稍作调息再战！'); setTimeout(function(){ if(dungeonRun === dr) dungeonNextFight(dr.did); }, 700); }
    } else {
      dungeonRun = null;
      toast('💀 副本挑战失败，铩羽而归（镖师体力已损）');
      renderAll();
    }
    return;
  }
  if(tourney){
    const tr = tourney;
    document.getElementById('combatLayer').classList.add('hidden');
    combat = null;
    if(result === 'win'){
      tr.node++;
      if(tr.node >= tr.total){ completeTournament(e); }
      else { toast('🏆 第 ' + tr.node + ' 场已过，再战下一位好手！'); setTimeout(function(){ if(tourney === tr) tourneyNextFight(); }, 700); }
    } else {
      tourney = null; tourneyCd = (day||1) + 10;
      toast('💀 武林大会折戟，未能夺魁（镖师体力已损）');
      renderAll();
    }
    return;
  }
  document.getElementById('combatLayer').classList.add('hidden');
  combat = null;
  finishEscort(order, e, result);
}
document.querySelectorAll('.combatActions button').forEach(b=>{
  b.onclick = ()=>{
    if(!combat || combat.busy || combat.over) return;
    const act = b.dataset.act;
    if(act === 'attack') doAttack();
    else if(act === 'skill'){ if(!combat.player.weapon){ toast('未装备兵器，无法施展绝技'); return; } doSkill(); }
    else if(act === 'dart') doDart();
    else if(act === 'beast') doBeastAct();
    else if(act === 'heal') useHerbInCombat();
    else if(act === 'defend') doDefend();
    else if(act === 'flee') tryFlee();
  };
});

function bindStore3D(body){
  const prev = body.querySelector('#gear3D');
  if(!prev || !B3D.isReady()) return;
  body.querySelectorAll('.storeItem').forEach(it=>{
    let kind = null, id = null;
    const probe = (k, v)=>{ if(v){ kind = k; id = v; } };
    ['equip','buyw','sellw','equipg','buyg','sellg','buyh','useh','sellh'].forEach(d=>{
      const b = it.querySelector('[data-' + d + ']');
      if(b) probe(d.indexOf('g') >= 0 ? 'gear' : (d.indexOf('h') >= 0 ? 'herb' : 'weapon'), b.dataset[d]);
    });
    const bv = it.querySelector('[data-bview]');
    if(bv){ kind = 'beast'; id = bv.dataset.bview; }
    if(kind && id){
      const show = ()=>{ B3D.mount(prev); B3D.setStage('prop'); B3D.setPropGLB(prop3DCfg(kind, id)); };
      it.onmouseenter = show;
      it.addEventListener('click', show);   // 触屏 tap 也触发预览
    }
  });
}

function renderStore(tab){
  tab = tab || currentStoreTab; currentStoreTab = tab;

function bindStore(tab){

  if(tab === 'weapon'){

    if(currentWeaponSub === 'gear'){
      body.querySelectorAll('[data-equipg]').forEach(b=> b.onclick = ()=> equipGearChoose(b.dataset.equipg));

function confirmDismiss(id, detailModal){

  modal.innerHTML = `<div class="box"><h3>解雇 ${e.name}？</h3>

      <button class="danger" id="dismissYes" style="flex:1;padding:9px;">确认解雇</button>
      <button class="close" id="dismissNo" style="flex:1;padding:9px;">取消</button>
    </div></div>`;
  document.getElementById('wrap').appendChild(modal);
  modal.querySelector('#dismissNo').onclick = ()=> modal.remove();
  modal.querySelector('#dismissYes').onclick = ()=>{
    const r = Math.floor((e.cost||0)*0.5);

}

    if(!this.canvas) return;
    this.ctx = this.canvas.getContext('2d');
    const fit = ()=>{ this.canvas.width = window.innerWidth; this.canvas.height = window.innerHeight; };
    fit(); (window.addEventListener || function(){}).call(window, 'resize', fit);
  },
  burst(x,y,big){
    const pal = this.PAL[rnd(0,this.PAL.length-1)];
    const n = big ? 120 : 70;
    for(let i=0;i<n;i++){
      const a = Math.random()*Math.PI*2, v = 1.6+Math.random()*(big?5.4:4.5);
      this.parts.push({ x, y, vx:Math.cos(a)*v, vy:Math.sin(a)*v, g:0.052,
        life:50+Math.random()*42, max:92,
        color: Math.random()<0.7 ? pal[rnd(0,pal.length-1)] : '#ffffff',
        size:1.5+Math.random()*2.2, glow:!!big });
    }
    // 二次爆裂：3 颗延迟火花，落地后再炸一小串
    for(let i=0;i<3;i++){
      this.parts.push({ x:x+(Math.random()-0.5)*30, y:y+(Math.random()-0.5)*30, vx:0, vy:0, g:0,
        life:14, max:14, color:pal[0], size:1.3, sub:true });
    }
  },
  rocket(){
    const x = 60+Math.random()*(this.canvas.width-120);
    this.rockets.push({ x, y:this.canvas.height+8, vy:-7.5-Math.random()*3.5 });
  },
  start(dur){
    this.init(); if(!this.canvas) return;
    this.on = true; this.t = 0; this.finale = false; if(dur) this.dur = dur;
    this.canvas.style.display = 'block';
    if(!this.raf) this.loop();
  },
  stop(){
    this.on = false; this.parts = []; this.rockets = [];
    if(this.canvas) this.canvas.style.display = 'none';
  },
  loop(){
    const c = this.ctx; if(!c){ this.raf = 0; return; }
    c.clearRect(0,0,this.canvas.width,this.canvas.height);
    this.t += 16;
    // 升空火箭：每 300ms 一发
    if(this.t % 300 < 16) this.rocket();
    // 穿插主爆点（偶发大爆带辉光）
    if(this.t % 560 < 16 && this.rockets.length < 4){
      this.burst(140+Math.random()*(this.canvas.width-280), 90+Math.random()*this.canvas.height*0.4, Math.random()<0.25);
    }
    // 收尾大齐射：最后 0.9s 三连爆
    if(!this.finale && this.t >= this.dur-900){
      this.finale = true;
      this.burst(this.canvas.width*0.5, this.canvas.height*0.3, true);
      this.burst(this.canvas.width*0.3, this.canvas.height*0.45, true);
      this.burst(this.canvas.width*0.7, this.canvas.height*0.45, true);
    }
    this.rockets.forEach(r=>{
      r.y += r.vy; r.vy += 0.07;
      // 尾迹火星
      if(Math.random()<0.6) this.parts.push({ x:r.x+(Math.random()-0.5)*3, y:r.y+6, vx:(Math.random()-0.5)*0.6, vy:1.2, g:0, life:16, max:18, color:'#ffd479', size:1.2 });
      c.fillStyle = '#fff3d0'; c.fillRect(r.x-1.5, r.y-6, 3, 7);
      if(r.vy > -1.2){ this.burst(r.x, r.y); r.done = 1; }
    });
    this.rockets = this.rockets.filter(r=>!r.done);
    // 粒子运动
    this.parts.forEach(p=>{
      if(p.sub && p.life===10){   // 二次爆裂触发
        for(let i=0;i<10;i++){
          const a = Math.random()*Math.PI*2, v = 0.8+Math.random()*2;
          this.parts.push({ x:p.x, y:p.y, vx:Math.cos(a)*v, vy:Math.sin(a)*v, g:0.04, life:22+Math.random()*16, max:38, color:p.color, size:1.2 });
        }
      }
      p.x += p.vx; p.y += p.vy; p.vy += p.g; p.vx *= 0.985; p.vy *= 0.985; p.life--;
      if(p.life > 0){
        c.globalAlpha = Math.max(0, p.life/p.max);
        c.fillStyle = p.color;
        if(p.glow){ c.shadowColor = p.color; c.shadowBlur = 8; }
        c.beginPath(); c.arc(p.x, p.y, p.size, 0, 6.2832); c.fill();
        if(p.glow){ c.shadowBlur = 0; }
      }
    });
    c.globalAlpha = 1;
    this.parts = this.parts.filter(p=>p.life>0);
    if(this.on && this.t < this.dur){ this.raf = requestAnimationFrame(()=>this.loop()); }
    else { this.raf = 0; this.stop(); }
  }
};

function showCampaignComplete(){
  const L = CAMPAIGN_LEVELS[campaignLevel-1];
  const isLast = campaignLevel >= 20;
  silver += L.rewardSilver; repute += L.rewardRepute;
  if(campaignLevel === 5) grantBeast('b_sun', '通关第五关');
  if(campaignLevel === 10) grantBeast('b_he', '通关第十关');
  if(campaignLevel === 15) grantBeast('b_shuang', '通关第十五关');
  FX.start(7000);   // 🎆 通关烟花
  const modal = document.createElement('div'); modal.className='modal';
  let h = '<div class="box" style="text-align:center;"><div class="box-body">'
    + '<div style="font-size:34px;line-height:1;">🎆🎇✨</div>'
    + '<div style="background:linear-gradient(135deg,#7a5a2e,#ffd479);-webkit-background-clip:text;background-clip:text;color:transparent;font-size:20px;font-weight:bold;margin:6px 0 2px;">🎊 通关成功公告 🎊</div>'
    + '<p style="font-size:13px;color:#c9b48c;margin:0 0 10px;">—— 威远镖局 · 第 '+(isLast?'二十':'')+campaignLevel+' 关 ——</p>'
    + '<h3 style="margin:6px 0;">🏆 '+L.name+' · 达成！</h3>';
  h += '<div class="storeItem" style="text-align:left;"><div class="info"><b>关卡奖励</b><small>银两 +'+L.rewardSilver+' · 声望 +'+L.rewardRepute+'</small></div></div>';
  h += '<p style="font-size:12px;color:#7ee08a;margin:8px 0;">✅ 走镖 '+L.deliveries+' 趟 · ✅ 声望 '+L.minRepute+' · ✅ 镖局 '+L.minLv+' 级 —— 全部达成</p>';
  if(!isLast){
    const N = CAMPAIGN_LEVELS[campaignLevel];
    h += '<p style="font-size:13px;color:#c9b48c;margin:10px 0;">下一关：第 '+(campaignLevel+1)+' 关 · '+N.name+'<br><small>目标：走镖 '+N.deliveries+' 趟 · 声望 '+N.minRepute+' · 镖局 '+N.minLv+' 级</small></p>';
    h += '</div><div class="box-footer"><button id="nextLv" class="danger" style="flex:1;">进入第 '+(campaignLevel+1)+' 关 ▶</button><button class="close" style="flex:1;">稍后再说</button></div></div>';
  } else {
    h += '<p style="font-size:14px;color:#ffd479;margin:10px 0;">🎉 二十关皆破，威远镖局名动天下，通关达成！</p>';
    h += '</div><div class="box-footer"><button id="nextLv" class="danger" style="flex:1;">通关结算 ▶</button><button class="close" style="flex:1;">稍后再说</button></div></div>';
  }
  modal.innerHTML = h;
  modal.querySelector('.close').onclick = ()=> modal.remove();
  modal.querySelector('#nextLv').onclick = ()=>{
    modal.remove();
    if(isLast){ winCampaign(); return; }
    campaignLevel++; campaignDeliveries = 0;
    const NL = CAMPAIGN_LEVELS[campaignLevel-1];
    // 镖局等级不再自动提升：由玩家花钱升级满足 minLv，难度由投入决定
    escorts.forEach(x=> x.tili = clamp(x.tili+20,1,x.maxTili||100));
    orders = orders.filter(o=>!o.done).concat([makeOrder()]);
    toast('🗺️ 进入第 '+campaignLevel+' 关 · '+NL.name+'（走镖 '+NL.deliveries+' 趟 · 声望 '+NL.minRepute+' · 镖局 '+NL.minLv+' 级）');
    renderAll();
  };
  document.getElementById('wrap').appendChild(modal);
}

// ===== 背景装饰：镖局牌匾 + 视口适配 =====
function bg(){
  // 根据场景切换背景图
  const bgHall = document.getElementById('bgHall');
  const bgLandscape = document.getElementById('bgLandscape');
  const bgBattle = document.getElementById('bgBattle');
  
  bgHall.style.display = bgMode === 'hall' ? 'block' : 'none';
  bgLandscape.style.display = bgMode === 'landscape' ? 'block' : 'none';
  bgBattle.style.display = bgMode === 'battle' ? 'block' : 'none';
  
  ctx.clearRect(0,0,W,H);
  
  // 半透明遮罩层
  ctx.fillStyle='rgba(21,17,12,0.65)'; 
  ctx.fillRect(0,0,W,H);
  
  // 镖局牌匾
  ctx.fillStyle='#3a2c18'; 
  ctx.fillRect(W/2-100,40,200,60);
  ctx.fillStyle='#ffd479'; 
  ctx.font='bold 28px serif'; 
  ctx.textAlign='center';
  ctx.fillText('威远镖局', W/2, 80);
  
  // 灯笼
  ctx.font='32px serif'; 
  ctx.fillText('🏮', W/2-120, 70); 
  ctx.fillText('🏮', W/2+120, 70);
  
  // 镖师站台（带头像）
  const startX = W/2 - (escorts.length * 80) / 2;
  escorts.forEach((e,i)=>{
    const x = startX + i * 80;
    const y = H - 100;
    
    // 头像
    const img = new Image();
    img.src = e.portrait;
    ctx.drawImage(img, x-25, y-50, 50, 50);
    
    // 头像边框
    ctx.strokeStyle = '#6b4f2a';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.arc(x, y-25, 26, 0, Math.PI*2);
    ctx.stroke();
    
    // 名字和状态
    ctx.fillStyle='#d8c8a8'; 
    ctx.font='13px sans-serif';
    ctx.fillText(e.name+'·武'+e.wuli, x, y+10);
    ctx.fillStyle='#ffd479'; 
    ctx.fillText('体力'+e.tili, x, y+28);
    
    if(e.busy){
      ctx.font='28px serif';
      ctx.fillText('🐴', x, y-60);
    }
  });
}
let last=performance.now();
function loop(now){
  const dt=(now-last)/1000; last=now;
  if(state==='playing'){ 
    bg(); 
  }
  requestAnimationFrame(loop);
}
