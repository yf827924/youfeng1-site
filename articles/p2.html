  <h1>怎样把老照片存进电脑</h1>
  <div class="meta">文章 · 示例正文</div>
  <div class="rule"></div>

  <p>家里的老相册越积越厚，纸也会老。趁还清楚，不妨挑个晴好的日子，把它们一张张存进电脑里，既是备份，也方便日后做成电子相册给孙辈看。</p>
  <p>准备一台手机或相机，把照片平铺在光线充足的地方，正对着拍，尽量别反光、别歪。拍完按年份建文件夹，名字简单些，比如"1985 全家福""1990 老屋"。</p>
  <p>存好之后，记得再备份一份到网盘或移动硬盘。两份放着，心里才踏实——这些画面，是一家人走过来的证据。</p>
