<div class="wrap">
  <a class="back" href="../index.html#articles">← 返回作品集</a>
  <span class="tag">心情 · 示例</span>
  <h1>写给我未来的信</h1>
  <div class="meta">文章 · 示例正文</div>
  <div class="rule"></div>

  <p>将来的我，你好吗？希望你读到这封信的时候，眼神还清亮，腿脚还利索，依然愿意为一碗粥、一场雪、一句旧话而心动。</p>
  <p>如果那时你正为某件事烦忧，请记得：你曾经那么努力地，把平凡的日子过得有滋有味。这一点，从来都没有变过。</p>
  <p>别怕慢，别怕老。该来的都会来，该亮的灯，也总会亮。</p>

  <div class="note">【示例正文】这是占位用的示例文字，请替换为你自己的文章。</div>
