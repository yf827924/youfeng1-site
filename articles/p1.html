  <h1>初学摄影的一点心得</h1>
  <div class="meta">文章 · 示例正文</div>
  <div class="rule"></div>

  <p>刚开始学拍照的时候，总想着把什么都拍进去——山要全，人要正，云要满。后来才慢慢明白，照片不是把世界搬回家，而是替你记住某一刻，心里那点说不清的滋味。</p>
  <p>所以现在我更愿意等。等光斜下来，等风停一停，等那个人刚好抬起头笑。机器替我们按下快门，可真正决定一张照片好不好看的，是按下之前，你有没有好好看过。</p>
  <p>这大概和过日子是一个道理：不必样样都抓在手里，留一点空白，反而装得下更多欢喜。</p>
